        (r.codigo ? '<div class="mail-sim"><p class="mail-tag">' + icon('mail', 15) + 'Caixa de entrada simulada</p><p><strong>Assunto:</strong> Recuperação de acesso</p><p>Seu código é <strong class="cod">' + esc(r.codigo) + '</strong>.</p></div>' : '') +
        '<form id="f-rec2" novalidate><div class="field"><label for="rc-cod">Código recebido</label><input id="rc-cod" class="input" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>' +
        '<div class="field"><label for="rc-s1">Nova senha</label><input id="rc-s1" class="input" type="password" autocomplete="new-password"><p class="hint">Mínimo de 6 caracteres, com letras e números.</p></div>' +
        '<div class="field"><label for="rc-s2">Repita a nova senha</label><input id="rc-s2" class="input" type="password" autocomplete="new-password"></div>' +
        '<button class="btn btn-primary btn-block" type="submit">Salvar nova senha</button></form>';
      const f2 = $('#f-rec2', box);
      $('#rc-cod', f2).focus();
      f2.addEventListener('submit', (ev) => {
        ev.preventDefault();
        UI.limparErros(f2);
        const s1 = $('#rc-s1', f2).value;
        if (s1.length < 6 || !/[A-Za-z]/.test(s1) || !/\d/.test(s1)) { UI.erro($('#rc-s1', f2), 'A senha precisa ter 6 ou mais caracteres, com letras e números.'); return; }
        if ($('#rc-s2', f2).value !== s1) { UI.erro($('#rc-s2', f2), 'As senhas não são iguais.'); return; }
        const rr = RA.DB.redefinirSenha(em.value, $('#rc-cod', f2).value, s1);
        if (!rr.ok) { UI.erro($('#rc-cod', f2), rr.erro); return; }
        UI.toast('Senha alterada. Entre com a nova senha.', 'ok');
        location.hash = '#/entrar';
      });
    });
    $('#rc-email', main).focus();
  };

  /* ------------------------------ Consulta de protocolo ------------------------------ */
  RA.views.protocolo = function (main, ctx) {
    const p = (ctx.params.p || '').trim();
    const user = RA.DB.usuarioAtual();
    const exemplos = RA.DB.manifestacoes().slice(-3).reverse().map((m) => m.protocolo);
    main.innerHTML = '<div class="container narrow"><h1 class="h2">Consultar protocolo</h1>' +
      '<p class="muted">Digite o número recebido ao registrar a manifestação. Não é preciso estar conectado.</p>' +
      '<form class="card card-pad row-form" id="f-prot" role="search"><div class="field grow"><label for="pt-in">Número do protocolo</label>' +
      '<input id="pt-in" class="input" placeholder="RA-2026-00001" value="' + esc(p) + '" autocomplete="off" spellcheck="false"></div>' +
      '<button class="btn btn-primary" type="submit">' + icon('search', 17) + 'Consultar</button></form>' +
      '<p class="muted">Para testar, use: ' + exemplos.map((x) => '<button type="button" class="chip-btn" data-ex="' + esc(x) + '">' + esc(x) + '</button>').join('') + '</p>' +
      '<div id="prot-res"></div></div>';
    const res = $('#prot-res', main);
    if (p) {
      const m = RA.DB.porProtocolo(p);
      if (!m) res.innerHTML = '<div class="card card-pad">' + UI.vazio('Protocolo não encontrado', 'Confira se o número está completo. O formato é RA-AAAA-NNNNN.') + '</div>';
      else {
        const tipo = RA.TIPOS[m.tipo];
        const visivel = tipo.publica || (user && (user.id === m.autorId || user.nivel === 'gestor'));
        const cat = RA.categoria(m.categoria);
        res.innerHTML = '<article class="card card-pad res-prot">' + UI.ticket(m) +
          '<div class="title-row"><h2 class="h3">' + (visivel ? esc(m.titulo) : esc(tipo.nome) + ' registrada') + '</h2>' + UI.statusBadge(m.status) + '</div>' +
          '<p class="meta"><span>' + icon('pin', 15) + esc(m.bairro) + '</span><span>' + icon('clock', 15) + 'Registrada em ' + UI.data(m.dataCriacao) + '</span><span class="chip">' + esc(cat.nome) + '</span><span class="chip chip-soft">' + esc(tipo.nome) + '</span></p>' +
          '<div class="prazo-line">' + UI.prazoBadge(m) + '<span class="muted">Encaminhada para ' + esc(m.orgao) + '</span></div>' +
          (visivel ? '<p class="pre">' + esc(m.descricao) + '</p>' : '<div class="note">' + icon('lock', 18) + '<p>O conteúdo de denúncias é restrito. Você vê apenas o andamento.</p></div>') +
          (m.resposta ? '<div class="resposta"><h3>' + icon('shield', 18) + 'Resposta oficial</h3><p class="pre">' + esc(m.resposta.texto) + '</p><p class="muted">' + esc(m.resposta.orgao) + ', ' + UI.dataHora(m.resposta.data) + '</p></div>' : '') +
          '<h3>Acompanhamento</h3>' + RA.linhaDoTempo(m) +
          (tipo.publica ? '<button type="button" class="btn btn-ghost" data-detalhe="' + m.id + '">' + icon('message', 16) + 'Ver comentários e apoios</button>' : '') + '</article>';
      }
    }
    $('#f-prot', main).addEventListener('submit', (e) => {
      e.preventDefault();
      const v = $('#pt-in', main).value.trim();
      location.hash = '#/protocolo' + (v ? '?p=' + encodeURIComponent(v) : '');
    });
    main.addEventListener('click', (e) => {
      const ex = e.target.closest('[data-ex]');
      if (ex) { location.hash = '#/protocolo?p=' + encodeURIComponent(ex.dataset.ex); }
    });
    RA.ligarCartoes(main, () => RA.remontar(main, (n) => RA.views.protocolo(n, ctx)));
    if (!p) $('#pt-in', main).focus();
  };
})();

</script>
  <script>
/* =========================================================================
   Resolve Aqui - telas do cidadão
   Nova manifestação (UC05), manifestações na região (UC01 a UC03),
   minha conta (UC04, UC06, UC07).
   ========================================================================= */
(function () {
  'use strict';
  const RA = window.RA;
  const UI = RA.UI;
  const esc = UI.esc;
  const icon = UI.icon;
  const $ = UI.$;
  RA.views = RA.views || {};

  const MAX_ANEXOS = 3;
  const MAX_MB = 10;
  const PARADAS = new Set(['para', 'com', 'uma', 'que', 'nos', 'dos', 'das', 'est', 'esta', 'esse', 'essa', 'mais', 'muito', 'sem', 'por', 'como', 'tem', 'ser', 'foi', 'ha', 'ja', 'rua', 'avenida']);

  function palavras(t) {
    return new Set(RA.sem(t).replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter((p) => p.length >= 4 && !PARADAS.has(p)));
  }

  /* Procura manifestações parecidas ainda abertas, para o cidadão apoiar em vez de duplicar */
  function parecidas(d) {
    if (!d.categoria) return [];
    const meus = palavras(d.titulo + ' ' + d.descricao);
    return RA.DB.manifestacoes()
      .filter((m) => RA.TIPOS[m.tipo].publica && m.status !== 'concluida' && m.categoria === d.categoria)
      .map((m) => {
        const outras = palavras(m.titulo + ' ' + m.descricao);
        let comuns = 0;
        meus.forEach((p) => { if (outras.has(p)) comuns++; });
        return { m, pontos: comuns + (d.bairro && m.bairro === d.bairro ? 2 : 0) };
      })
      .filter((x) => x.pontos >= 2 && (d.titulo.length + d.descricao.length > 0))
      .sort((a, b) => b.pontos - a.pontos || RA.Stats.apoios(b.m) - RA.Stats.apoios(a.m))
      .slice(0, 3).map((x) => x.m);
  }

  /* ------------------------------ Nova manifestação ------------------------------ */
  RA.views.nova = function (main) {
    const user = RA.DB.usuarioAtual();
    let anexos = [];
    let coord = null;

    main.innerHTML = '<div class="container"><div class="page-head"><h1 class="h2">Nova manifestação</h1>' +
      '<p class="muted">Conte o que está acontecendo. Quanto mais detalhes, mais rápido o órgão consegue agir.</p></div>' +
      '<div class="split"><form id="f-nova" class="card card-pad" novalidate>' +
      '<fieldset class="seg"><legend>Tipo de manifestação</legend><div class="seg-opts">' + Object.keys(RA.TIPOS).map((k, i) =>
        '<label class="seg-opt"><input type="radio" name="tipo" value="' + k + '"' + (i === 0 ? ' checked' : '') + '><span><strong>' + esc(RA.TIPOS[k].nome) + '</strong><small>' + esc(RA.TIPOS[k].desc) + '</small></span></label>').join('') + '</div></fieldset>' +
      '<div class="field"><label for="nv-titulo">Título</label><input id="nv-titulo" class="input" maxlength="80" placeholder="Descreva brevemente o problema" autocomplete="off"></div>' +
      '<div class="field"><label for="nv-cat">Assunto</label><select id="nv-cat" class="input">' + UI.opcoes(RA.CATEGORIAS, '', 'Selecione') + '</select></div>' +
      '<div class="field"><label for="nv-desc">Descrição</label><textarea id="nv-desc" class="input" rows="5" maxlength="1500" placeholder="Descreva detalhadamente o problema: o que acontece, desde quando e quem é afetado."></textarea><p class="hint" id="nv-cont"></p></div>' +
      '<div class="grid-2"><div class="field"><label for="nv-bairro">Bairro</label><select id="nv-bairro" class="input">' + UI.opcoes(RA.BAIRROS, user.bairro, 'Selecione') + '</select></div>' +
      '<div class="field"><label for="nv-end">Endereço ou ponto de referência</label><input id="nv-end" class="input" maxlength="120" placeholder="Rua, número ou referência"></div></div>' +
      '<div class="field"><button type="button" class="btn btn-ghost btn-sm" id="nv-geo">' + icon('locate', 16) + 'Usar minha localização atual</button><p class="hint" id="nv-geo-s">Opcional. Ajuda a equipe a achar o local exato.</p></div>' +
      '<div class="field"><span class="label" id="lb-anexo">Fotos ou vídeos (opcional)</span>' +
      '<label class="drop" for="nv-arq" id="drop">' + icon('clip', 22) + '<span><strong>Clique ou arraste os arquivos aqui</strong><small>Até ' + MAX_ANEXOS + ' arquivos de ' + MAX_MB + ' MB. Fotos são reduzidas para caber no navegador.</small></span></label>' +
      '<input id="nv-arq" type="file" accept="image/*,video/*" multiple class="sr-only" aria-labelledby="lb-anexo"><ul class="prev" id="nv-prev"></ul></div>' +
      '<label class="check"><input type="checkbox" id="nv-anon"><span>Não mostrar meu nome para outros cidadãos. A ouvidoria continua identificando você para poder responder.</span></label>' +
      '<button type="submit" class="btn btn-primary btn-lg">' + icon('send', 18) + 'Enviar manifestação</button></form>' +
      '<aside class="side"><div class="card card-pad" id="similares" aria-live="polite"></div>' +
      '<div class="card card-pad"><h2 class="h3">O que acontece depois</h2><ul class="ticks"><li>Você recebe um número de protocolo.</li><li>A ouvidoria faz a triagem e encaminha ao órgão responsável.</li><li>Cada etapa fica no histórico e você é avisado.</li><li>A resposta vem em até ' + RA.PRAZO_DIAS + ' dias.</li></ul></div></aside></div></div>';

    const f = $('#f-nova', main);
    UI.contador($('#nv-desc', f), $('#nv-cont', f), 10, 1500);

    function dados() {
      return {
        tipo: ($('input[name="tipo"]:checked', f) || {}).value, titulo: $('#nv-titulo', f).value, categoria: $('#nv-cat', f).value,
        descricao: $('#nv-desc', f).value, bairro: $('#nv-bairro', f).value, endereco: $('#nv-end', f).value, anonima: $('#nv-anon', f).checked,
      };
    }
    function pintarSimilares() {
      const d = dados();
      const box = $('#similares', main);
      const l = parecidas(d);
      if (l.length) {
        box.innerHTML = '<h2 class="h3">Já existe algo parecido</h2><p class="muted">Apoiar uma manifestação aberta ajuda a priorizar o problema e evita registros repetidos.</p><ul class="sim">' + l.map((m) =>
          '<li><button type="button" class="feed-btn" data-detalhe="' + m.id + '"><strong>' + esc(m.titulo) + '</strong><span class="muted">' + esc(m.bairro) + ', ' + RA.Stats.apoios(m) + ' apoios, ' + esc(RA.STATUS[m.status].nome) + '</span></button></li>').join('') + '</ul>';
      } else {
        box.innerHTML = '<h2 class="h3">Antes de enviar</h2><ul class="ticks"><li>Escolha o assunto: o sistema avisa se já houver registro parecido.</li><li>Informe onde acontece. Bairro e referência aceleram o atendimento.</li><li>Fotos ajudam a equipe a avaliar a urgência.</li></ul>';
      }
    }
    pintarSimilares();
    const pintarSimilaresLento = UI.debounce(pintarSimilares, 250);
    ['#nv-titulo', '#nv-cat', '#nv-desc', '#nv-bairro'].forEach((s) => { $(s, f).addEventListener('input', pintarSimilaresLento); $(s, f).addEventListener('change', pintarSimilares); });

    /* anexos */
    function pintarAnexos() {
      $('#nv-prev', f).innerHTML = anexos.map((a, i) => '<li>' + (a.dataUrl ? '<img src="' + a.dataUrl + '" alt="">' : '<span class="prev-ico">' + icon('image', 22) + '</span>') +
        '<span class="prev-n">' + esc(a.nome) + (a.dataUrl ? '' : '<small>Vídeo: só o nome é guardado no protótipo</small>') + '</span>' +
        '<button type="button" class="icon-btn" data-rm="' + i + '" aria-label="Remover ' + esc(a.nome) + '">' + icon('x', 16) + '</button></li>').join('');
    }
    async function adicionar(files) {
      for (const file of Array.from(files)) {
        if (anexos.length >= MAX_ANEXOS) { UI.toast('O limite é de ' + MAX_ANEXOS + ' arquivos.', 'info'); break; }
        if (file.size > MAX_MB * 1048576) { UI.toast(file.name + ' passa de ' + MAX_MB + ' MB.', 'erro'); continue; }
        if (file.type.startsWith('image/')) {
          try { anexos.push({ nome: file.name, tipo: 'image/jpeg', dataUrl: await UI.lerImagem(file, 900, 0.7) }); }
          catch (e) { UI.toast('Não foi possível ler ' + file.name + '.', 'erro'); }
        } else if (file.type.startsWith('video/')) anexos.push({ nome: file.name, tipo: file.type, dataUrl: null });
        else UI.toast(file.name + ' não é foto nem vídeo.', 'erro');
      }
      pintarAnexos();
    }
    $('#nv-arq', f).addEventListener('change', (e) => { adicionar(e.target.files); e.target.value = ''; });
    const drop = $('#drop', f);
    ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', (e) => adicionar(e.dataTransfer.files));
    f.addEventListener('click', (e) => {
      const rm = e.target.closest('[data-rm]');
      if (rm) { anexos.splice(Number(rm.dataset.rm), 1); pintarAnexos(); }
    });

    /* localização */
    $('#nv-geo', f).addEventListener('click', () => {
      const s = $('#nv-geo-s', f);
      if (!navigator.geolocation) { s.textContent = 'Este navegador não oferece localização.'; return; }
      s.textContent = 'Buscando a sua localização...';
      navigator.geolocation.getCurrentPosition((p) => {
        coord = { lat: Number(p.coords.latitude.toFixed(5)), lng: Number(p.coords.longitude.toFixed(5)) };
        s.textContent = 'Localização anexada: ' + coord.lat + ', ' + coord.lng + '.';
      }, () => { s.textContent = 'Não foi possível obter a localização. Informe o endereço no campo ao lado.'; }, { timeout: 8000 });
    });

    f.addEventListener('submit', (e) => {
      e.preventDefault();
      UI.limparErros(f);
      const d = dados();
      let primeiro = null;
      const falha = (sel, msg) => { UI.erro($(sel, f), msg); if (!primeiro) primeiro = $(sel, f); };
      if (d.titulo.trim().length < 5) falha('#nv-titulo', 'Escreva um título com pelo menos 5 caracteres.');
      if (!d.categoria) falha('#nv-cat', 'Escolha o assunto.');
      if (d.descricao.trim().length < 10) falha('#nv-desc', 'A descrição precisa ter pelo menos 10 caracteres.');
      if (!d.bairro) falha('#nv-bairro', 'Escolha o bairro.');
      if (primeiro) { primeiro.focus(); return; }
      const r = RA.DB.criarManifestacao(Object.assign(d, { anexos, coord }), user);
      if (!r.ok) { UI.toast(r.erro, 'erro'); return; }
      const m = r.manifestacao;
      const h = UI.modal('<div class="modal-b sucesso"><span class="ok-ico">' + icon('check', 28) + '</span><h2>Manifestação registrada</h2>' +
        '<p>Guarde o número abaixo. Com ele você acompanha o andamento, mesmo sem entrar na conta.</p>' + UI.ticket(m) +
        '<p class="muted">Prazo para resposta: até ' + RA.PRAZO_DIAS + ' dias, conforme a Lei nº 13.460/2017.</p>' +
        '<div class="btn-row center"><a class="btn btn-primary" href="#/protocolo?p=' + encodeURIComponent(m.protocolo) + '" data-close>Acompanhar</a>' +
        '<button type="button" class="btn btn-ghost" data-close>Registrar outra</button></div></div>', { size: 'sm', title: 'Manifestação registrada' });
      h.el.addEventListener('click', (ev) => { if (ev.target.closest('a[data-close]')) h.close(); });
      anexos = []; coord = null;
      f.reset();
      $('#nv-bairro', f).value = user.bairro;
      $('#nv-geo-s', f).textContent = 'Opcional. Ajuda a equipe a achar o local exato.';
      pintarAnexos();
      UI.contador($('#nv-desc', f), $('#nv-cont', f), 10, 1500);
      pintarSimilares();
    });

    RA.ligarCartoes(main, pintarSimilares);
    $('#nv-titulo', f).focus();
  };

  /* ------------------------------ Na minha região ------------------------------ */
  const estadoRegiao = { q: '', bairro: null, categoria: '', status: '', ordem: 'recentes', limite: 9 };

  RA.views.regiao = function (main) {
    const user = RA.DB.usuarioAtual();
    if (estadoRegiao.bairro === null) estadoRegiao.bairro = user ? user.bairro : '';
    const e = estadoRegiao;

    main.innerHTML = '<div class="container"><div class="page-head"><h1 class="h2">Manifestações na região</h1>' +
      '<p class="muted">Veja o que os vizinhos registraram, comente e apoie. Denúncias não aparecem aqui.</p></div>' +
      '<form class="filters card" id="f-reg" role="search"><div class="field grow"><label for="rg-q">Buscar</label><input id="rg-q" class="input" type="search" placeholder="Palavra, rua ou protocolo" value="' + esc(e.q) + '"></div>' +
      '<div class="field"><label for="rg-bairro">Bairro</label><select id="rg-bairro" class="input">' + UI.opcoes(RA.BAIRROS, e.bairro, 'Todos os bairros') + '</select></div>' +
      '<div class="field"><label for="rg-cat">Assunto</label><select id="rg-cat" class="input">' + UI.opcoes(RA.CATEGORIAS, e.categoria, 'Todos os assuntos') + '</select></div>' +
      '<div class="field"><label for="rg-st">Situação</label><select id="rg-st" class="input"><option value="">Todas</option>' + Object.keys(RA.STATUS).map((k) => '<option value="' + k + '"' + (e.status === k ? ' selected' : '') + '>' + RA.STATUS[k].nome + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="rg-ord">Ordem</label><select id="rg-ord" class="input"><option value="recentes"' + (e.ordem === 'recentes' ? ' selected' : '') + '>Mais recentes</option><option value="apoios"' + (e.ordem === 'apoios' ? ' selected' : '') + '>Mais apoiadas</option><option value="antigas"' + (e.ordem === 'antigas' ? ' selected' : '') + '>Mais antigas</option></select></div></form>' +
      '<p class="result-line" id="rg-resumo" aria-live="polite"></p><div class="mgrid" id="rg-lista"></div><div class="center" id="rg-mais"></div></div>';

    function pintar() {
      const base = RA.DB.manifestacoes().filter((m) => RA.TIPOS[m.tipo].publica);
      const l = RA.filtrar(base, e);
      const r = RA.Stats.resumo(l);
      $('#rg-resumo', main).innerHTML = '<strong>' + l.length + '</strong> ' + (l.length === 1 ? 'manifestação' : 'manifestações') + (e.bairro ? ' em ' + esc(e.bairro) : ' na cidade') +
        (l.length ? ': ' + r.pendentes + ' em tratamento e ' + r.concluida + ' concluídas.' : '.');
      const vis = l.slice(0, e.limite);
      $('#rg-lista', main).innerHTML = vis.length ? vis.map((m) => RA.cartaoManifestacao(m, user)).join('') :
        UI.vazio('Nada encontrado', 'Tente outro bairro ou assunto. Se o problema não está na lista, registre uma nova manifestação.', '<a class="btn btn-primary" href="#/nova">' + icon('plus', 16) + 'Nova manifestação</a>');
      $('#rg-mais', main).innerHTML = l.length > vis.length ? '<button type="button" class="btn btn-ghost" id="bt-mais">Mostrar mais (' + (l.length - vis.length) + ')</button>' : '';
    }
    pintar();

    const f = $('#f-reg', main);
    f.addEventListener('submit', (ev) => ev.preventDefault());
    const mapa = { 'rg-q': 'q', 'rg-bairro': 'bairro', 'rg-cat': 'categoria', 'rg-st': 'status', 'rg-ord': 'ordem' };
    const lento = UI.debounce(pintar, 200);
    f.addEventListener('input', (ev) => { const k = mapa[ev.target.id]; if (k) { e[k] = ev.target.value; e.limite = 9; lento(); } });
    main.addEventListener('click', (ev) => { if (ev.target.closest('#bt-mais')) { e.limite += 9; pintar(); } });
    RA.ligarCartoes(main, pintar);
  };

  /* ------------------------------ Minha conta ------------------------------ */
  function formEditar(m) {
    return UI.cabecalhoModal('Editar manifestação', m.protocolo) + '<form id="f-edit" novalidate class="modal-b">' +
      '<div class="field"><label for="ed-tipo">Tipo</label><select id="ed-tipo" class="input">' + Object.keys(RA.TIPOS).map((k) => '<option value="' + k + '"' + (k === m.tipo ? ' selected' : '') + '>' + RA.TIPOS[k].nome + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="ed-titulo">Título</label><input id="ed-titulo" class="input" maxlength="80" value="' + esc(m.titulo) + '"></div>' +
      '<div class="field"><label for="ed-cat">Assunto</label><select id="ed-cat" class="input">' + UI.opcoes(RA.CATEGORIAS, m.categoria) + '</select></div>' +
      '<div class="field"><label for="ed-desc">Descrição</label><textarea id="ed-desc" class="input" rows="5" maxlength="1500">' + esc(m.descricao) + '</textarea><p class="hint" id="ed-cont"></p></div>' +
      '<div class="grid-2"><div class="field"><label for="ed-bairro">Bairro</label><select id="ed-bairro" class="input">' + UI.opcoes(RA.BAIRROS, m.bairro) + '</select></div>' +
      '<div class="field"><label for="ed-end">Endereço ou referência</label><input id="ed-end" class="input" maxlength="120" value="' + esc(m.endereco) + '"></div></div>' +
      '<label class="check"><input type="checkbox" id="ed-anon"' + (m.anonima ? ' checked' : '') + '><span>Não mostrar meu nome para outros cidadãos.</span></label>' +
      '<div class="modal-f flush"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button type="submit" class="btn btn-primary">Salvar alterações</button></div></form>';
  }

  const estadoMinhas = { q: '', status: '' };

  RA.views.conta = function (main, ctx) {
    const user = RA.DB.usuarioAtual();
    const aba = ctx.params.aba || 'dados';
    const naoLidas = RA.DB.notificacoesDe(user.id).filter((n) => !n.lida).length;
    const abas = [['dados', 'Meus dados', 'user'], ['manifestacoes', 'Minhas manifestações', 'list'], ['avisos', 'Notificações', 'bell']];

    main.innerHTML = '<div class="container narrow-lg"><div class="page-head"><h1 class="h2">Minha conta</h1></div>' +
      '<div class="tabs" role="tablist" aria-label="Seções da conta">' + abas.map((a) => '<a role="tab" class="tab' + (a[0] === aba ? ' on' : '') + '" aria-selected="' + (a[0] === aba ? 'true' : 'false') + '" href="#/conta?aba=' + a[0] + '">' + icon(a[2], 17) + a[1] + (a[0] === 'avisos' && naoLidas ? '<span class="count">' + naoLidas + '</span>' : '') + '</a>').join('') + '</div>' +
      '<div id="aba" role="tabpanel"></div></div>';
    const box = $('#aba', main);

    if (aba === 'dados') {
      box.innerHTML = '<form class="card card-pad" id="f-dados" novalidate><div class="grid-2"><div class="field"><label for="dt-nome">Nome completo</label><input id="dt-nome" class="input" value="' + esc(user.nome) + '" autocomplete="name"></div>' +
        '<div class="field"><label for="dt-cpf">CPF</label><input id="dt-cpf" class="input" value="' + esc(UI.cpfOculto(user.cpf)) + '" readonly aria-describedby="dt-cpf-h"><p class="hint" id="dt-cpf-h">O CPF não pode ser alterado por aqui.</p></div></div>' +
        '<div class="grid-2"><div class="field"><label for="dt-email">E-mail</label><input id="dt-email" class="input" type="email" value="' + esc(user.email) + '" autocomplete="email"></div>' +
        '<div class="field"><label for="dt-tel">Telefone</label><input id="dt-tel" class="input" inputmode="tel" value="' + esc(user.telefone || '') + '" autocomplete="tel"></div></div>' +
        '<div class="grid-2"><div class="field"><label for="dt-bairro">Bairro</label><select id="dt-bairro" class="input">' + UI.opcoes(RA.BAIRROS, user.bairro) + '</select></div>' +
        '<div class="field"><label for="dt-end">Endereço</label><input id="dt-end" class="input" value="' + esc(user.endereco || '') + '" autocomplete="street-address"></div></div>' +
        '<button class="btn btn-primary" type="submit">Salvar alterações</button></form>' +
        '<form class="card card-pad" id="f-senha" novalidate><h2 class="h3">Alterar senha</h2><div class="grid-3"><div class="field"><label for="sn-a">Senha atual</label><input id="sn-a" class="input" type="password" autocomplete="current-password"></div>' +
        '<div class="field"><label for="sn-n">Nova senha</label><input id="sn-n" class="input" type="password" autocomplete="new-password"></div>' +
        '<div class="field"><label for="sn-n2">Repita a nova senha</label><input id="sn-n2" class="input" type="password" autocomplete="new-password"></div></div>' +
        '<button class="btn btn-ghost" type="submit">Alterar senha</button></form>';
      $('#dt-tel', box).addEventListener('input', (e) => { e.target.value = UI.mascaraTel(e.target.value); });
      const f = $('#f-dados', box);
      f.addEventListener('submit', (e) => {
        e.preventDefault();
        UI.limparErros(f);
        if ($('#dt-nome', f).value.trim().split(/\s+/).length < 2) { UI.erro($('#dt-nome', f), 'Informe nome e sobrenome.'); return; }
        if (!UI.emailValido($('#dt-email', f).value)) { UI.erro($('#dt-email', f), 'Informe um e-mail válido.'); return; }
        const r = RA.DB.atualizarUsuario(user.id, { nome: $('#dt-nome', f).value.trim(), email: $('#dt-email', f).value.trim(), telefone: $('#dt-tel', f).value, bairro: $('#dt-bairro', f).value, endereco: $('#dt-end', f).value });
        if (!r.ok) { UI.erro($('#dt-email', f), r.erro); return; }
        UI.toast('Dados atualizados.', 'ok');
        RA.atualizarCabecalho();
      });
      const fs = $('#f-senha', box);
      fs.addEventListener('submit', (e) => {
        e.preventDefault();
        UI.limparErros(fs);
        if ($('#sn-a', fs).value !== user.senha) { UI.erro($('#sn-a', fs), 'A senha atual não confere.'); return; }
        const n = $('#sn-n', fs).value;
        if (n.length < 6 || !/[A-Za-z]/.test(n) || !/\d/.test(n)) { UI.erro($('#sn-n', fs), 'Use 6 ou mais caracteres, com letras e números.'); return; }
        if ($('#sn-n2', fs).value !== n) { UI.erro($('#sn-n2', fs), 'As senhas não são iguais.'); return; }
        RA.DB.atualizarUsuario(user.id, { senha: n });
        fs.reset();
        UI.toast('Senha alterada.', 'ok');
      });
    } else if (aba === 'manifestacoes') {
      const e = estadoMinhas;
      box.innerHTML = '<form class="filters card" role="search"><div class="field grow"><label for="mn-q">Buscar nas minhas manifestações</label><input id="mn-q" class="input" type="search" value="' + esc(e.q) + '" placeholder="Título, protocolo ou bairro"></div>' +
        '<div class="field"><label for="mn-st">Situação</label><select id="mn-st" class="input"><option value="">Todas</option>' + Object.keys(RA.STATUS).map((k) => '<option value="' + k + '"' + (e.status === k ? ' selected' : '') + '>' + RA.STATUS[k].nome + '</option>').join('') + '</select></div>' +
        '<a class="btn btn-primary" href="#/nova">' + icon('plus', 16) + 'Nova</a></form><div id="mn-lista"></div>';
      const pintar = () => {
        const l = RA.filtrar(RA.DB.doUsuario(user.id), e);
        $('#mn-lista', box).innerHTML = l.length ? '<ul class="lista-m">' + l.map((m) => {
          const edit = m.status === 'aberta';
          return '<li class="card"><div class="lm-main"><div class="title-row"><h3>' + esc(m.titulo) + '</h3>' + UI.statusBadge(m.status) + '</div>' +
            '<p class="meta"><span>' + esc(m.protocolo) + '</span><span>' + icon('pin', 15) + esc(m.bairro) + '</span><span>' + icon('clock', 15) + UI.data(m.dataCriacao) + '</span><span class="chip chip-soft">' + esc(RA.TIPOS[m.tipo].nome) + '</span></p>' +
            '<p>' + UI.prazoBadge(m) + '</p></div>' +
            '<div class="lm-act"><button type="button" class="btn btn-ghost btn-sm" data-detalhe="' + m.id + '">' + icon('eye', 15) + 'Ver</button>' +
            (edit ? '<button type="button" class="btn btn-ghost btn-sm" data-editar="' + m.id + '">' + icon('edit', 15) + 'Editar</button><button type="button" class="btn btn-ghost btn-sm perigo" data-excluir="' + m.id + '">' + icon('trash', 15) + 'Excluir</button>' : '') + '</div></li>';
        }).join('') + '</ul>' : UI.vazio('Nenhuma manifestação por aqui', RA.DB.doUsuario(user.id).length ? 'Nenhum resultado para esse filtro.' : 'Quando você registrar uma manifestação, ela aparece nesta lista.', '<a class="btn btn-primary" href="#/nova">' + icon('plus', 16) + 'Registrar manifestação</a>');
      };
      pintar();
      const lento = UI.debounce(pintar, 200);
      $('#mn-q', box).addEventListener('input', (ev) => { e.q = ev.target.value; lento(); });
      $('#mn-st', box).addEventListener('change', (ev) => { e.status = ev.target.value; pintar(); });
      box.addEventListener('click', async (ev) => {
        const ed = ev.target.closest('[data-editar]');
        const ex = ev.target.closest('[data-excluir]');
        if (ed) {
          const m = RA.DB.manifestacao(Number(ed.dataset.editar));
          const h = UI.modal(formEditar(m), { size: 'md', title: 'Editar manifestação' });
          UI.contador($('#ed-desc', h.el), $('#ed-cont', h.el), 10, 1500);
          const f = $('#f-edit', h.el);
          f.addEventListener('submit', (e2) => {
            e2.preventDefault();
            UI.limparErros(f);
            if ($('#ed-titulo', f).value.trim().length < 5) { UI.erro($('#ed-titulo', f), 'Escreva um título com pelo menos 5 caracteres.'); return; }
            if ($('#ed-desc', f).value.trim().length < 10) { UI.erro($('#ed-desc', f), 'A descrição precisa ter pelo menos 10 caracteres.'); return; }
            const r = RA.DB.editarManifestacao(m.id, { tipo: $('#ed-tipo', f).value, titulo: $('#ed-titulo', f).value, categoria: $('#ed-cat', f).value, descricao: $('#ed-desc', f).value, bairro: $('#ed-bairro', f).value, endereco: $('#ed-end', f).value, anonima: $('#ed-anon', f).checked }, user);
            if (!r.ok) { UI.toast(r.erro, 'erro'); return; }
            h.close();
            UI.toast('Manifestação atualizada.', 'ok');
            pintar();
          });
        } else if (ex) {
          const m = RA.DB.manifestacao(Number(ex.dataset.excluir));
          if (await UI.confirmar({ titulo: 'Excluir manifestação?', mensagem: 'A manifestação "' + m.titulo + '" será removida e não poderá ser recuperada.', ok: 'Excluir', perigo: true })) {
            const r = RA.DB.excluirManifestacao(m.id, user);
            UI.toast(r.ok ? 'Manifestação excluída.' : r.erro, r.ok ? 'ok' : 'erro');
            pintar();
          }
        }
      });
      RA.ligarCartoes(box, pintar);
    } else {
      const l = RA.DB.notificacoesDe(user.id);
      box.innerHTML = '<div class="card card-pad">' + (l.length ? '<ul class="notifs">' + l.map((n) => '<li class="' + (n.lida ? '' : 'nova') + '"><span class="n-ico">' + icon('bell', 16) + '</span><div><p>' + esc(n.texto) + '</p><span class="muted">' + UI.dataHora(n.data) + '</span></div>' +
        (n.manifestacaoId && RA.DB.manifestacao(n.manifestacaoId) ? '<button type="button" class="btn btn-ghost btn-sm" data-detalhe="' + n.manifestacaoId + '">Abrir</button>' : '') + '</li>').join('') + '</ul>' :
        UI.vazio('Sem notificações', 'Quando a ouvidoria atualizar uma manifestação sua, o aviso aparece aqui.')) + '</div>';
      RA.DB.marcarLidas(user.id);
      RA.atualizarCabecalho();
      RA.ligarCartoes(box);
    }
  };
})();

</script>
  <script>
/* =========================================================================
   Resolve Aqui - telas da ouvidoria (gestor) e do Legislativo (vereador)
   Painel, fila de tratamento, relatórios (UC12), usuários (UC13 a UC15),
   avaliações do protótipo e painel de fiscalização.
   ========================================================================= */
(function () {
  'use strict';
  const RA = window.RA;
  const UI = RA.UI;
  const esc = UI.esc;
  const icon = UI.icon;
  const $ = UI.$;
  RA.views = RA.views || {};

  const PERIODOS = [[0, 'Todo o período'], [30, 'Últimos 30 dias'], [90, 'Últimos 90 dias'], [180, 'Últimos 180 dias']];
  const optPeriodo = (sel) => PERIODOS.map((p) => '<option value="' + p[0] + '"' + (Number(sel) === p[0] ? ' selected' : '') + '>' + p[1] + '</option>').join('');
  const nomePeriodo = (n) => (PERIODOS.find((p) => p[0] === Number(n)) || PERIODOS[0])[1];

  const link = (rota, params) => '#/' + rota + '?' + Object.keys(params).filter((k) => params[k]).map((k) => k + '=' + encodeURIComponent(params[k])).join('&');
  const chipTaxa = (x) => '<span class="rate ' + (x >= 0.7 ? 'rt-ok' : x >= 0.5 ? 'rt-mid' : 'rt-low') + '">' + UI.pct(x) + '</span>';
  const tempo = (d) => (d == null ? '-' : UI.dec(d) + ' d');

  function tabela(cols, linhas, classe) {
    return '<div class="tbl-wrap"><table class="tbl ' + (classe || '') + '"><thead><tr>' + cols.map((c) => '<th scope="col"' + (c.num ? ' class="num"' : '') + '>' + esc(c.t) + '</th>').join('') + '</tr></thead><tbody>' +
      linhas.map((l) => '<tr>' + l.map((c, i) => (i === 0 ? '<th scope="row">' + c + '</th>' : '<td' + (cols[i] && cols[i].num ? ' class="num"' : '') + '>' + c + '</td>')).join('') + '</tr>').join('') + '</tbody></table></div>';
  }
  const colsGrupo = (rot) => [{ t: rot }, { t: 'Total', num: 1 }, { t: 'Abertas', num: 1 }, { t: 'Em análise', num: 1 }, { t: 'Em andamento', num: 1 }, { t: 'Concluídas', num: 1 }, { t: 'Taxa', num: 1 }, { t: 'Tempo médio', num: 1 }];
  const linhaGrupo = (g) => [esc(g.nome), UI.num(g.total), g.aberta, g.analise, g.andamento, g.concluida, chipTaxa(g.taxa), tempo(g.mediaDias)];

  const tabelaRecorrentes = (rec, comLink) => tabela(
    [{ t: 'Assunto' }, { t: 'Bairro' }, { t: 'Pendentes', num: 1 }, { t: 'Apoios', num: 1 }, { t: 'Mais antiga', num: 1 }, { t: 'Órgão responsável' }, { t: 'Índice', num: 1 }].concat(comLink ? [{ t: '' }] : []),
    rec.map((r) => [esc(RA.categoria(r.categoria).nome), esc(r.bairro), r.qtd, r.apoios, r.maisAntiga + ' d', esc(r.orgao), '<strong>' + UI.dec(r.indice) + '</strong>']
      .concat(comLink ? ['<a class="btn btn-ghost btn-sm" href="' + link('fila', { categoria: r.categoria, bairro: r.bairro, status: 'pendente' }) + '">Ver</a>'] : [])));

  const AVISO_INDICE = '<details class="como"><summary>Como o índice é calculado</summary><p>Cada manifestação pendente vale 1 ponto. Somam-se 0,25 por apoio de cidadão e até 2 pontos pelo tempo de espera (limite de 60 dias). O índice ajuda a ordenar a análise, mas não substitui os estudos técnicos, o orçamento disponível e os critérios legais da decisão administrativa.</p></details>';

  /* ------------------------------ Painel (gestor) ------------------------------ */
  const estadoPainel = { periodo: 0 };
  RA.views.painel = function (main) {
    const todas = RA.DB.manifestacoes();
    const base = RA.Stats.periodo(todas, estadoPainel.periodo);
    const r = RA.Stats.resumo(base);
    const v = RA.Stats.variacao(todas, estadoPainel.periodo);
    const cats = RA.Stats.porCategoria(base);
    const bairros = RA.Stats.porBairro(base).slice(0, 8);
    const orgaos = RA.Stats.porOrgao(base).sort((a, b) => b.pendentes - a.pendentes);
    const rec = RA.Stats.recorrentes(base, 2).slice(0, 6);
    const user = RA.DB.usuarioAtual();

    main.innerHTML = '<div class="container"><div class="page-head row-between"><div><h1 class="h2">Painel da ouvidoria</h1><p class="muted">Olá, ' + esc(user.nome.split(' ')[0]) + '. Veja onde estão os problemas e o que precisa de resposta.</p></div>' +
      '<div class="field inline"><label for="pn-per">Período</label><select id="pn-per" class="input">' + optPeriodo(estadoPainel.periodo) + '</select></div></div>' +
      '<div class="kpis kpis-6">' +
      UI.kpi({ rotulo: 'Recebidas', valor: UI.num(r.total), icone: 'message', dica: v == null ? 'No período selecionado' : (v >= 0 ? '+' : '') + v + '% contra o período anterior' }) +
      UI.kpi({ rotulo: 'Pendentes', valor: UI.num(r.pendentes), icone: 'alert', tom: 'bad', dica: r.aberta + ' abertas e ' + r.analise + ' em análise' }) +
      UI.kpi({ rotulo: 'Em andamento', valor: UI.num(r.andamento), icone: 'clock', tom: 'warn', dica: 'Com o órgão responsável' }) +
      UI.kpi({ rotulo: 'Concluídas', valor: UI.num(r.concluida), icone: 'check', tom: 'ok', dica: UI.pct(r.taxa) + ' do total' }) +
      UI.kpi({ rotulo: 'Tempo médio', valor: r.mediaDias == null ? '-' : UI.dec(r.mediaDias) + ' dias', icone: 'trend', dica: r.foraPrazo + ' concluídas fora do prazo' }) +
      '<a class="kpi kpi-link' + (r.atrasadas ? ' kpi-bad' : '') + '" href="' + link('fila', { atrasadas: 1 }) + '"><div class="kpi-top"><span class="kpi-l">Prazo vencido</span>' + icon('clock', 18) + '</div><div class="kpi-v">' + UI.num(r.atrasadas) + '</div><div class="kpi-h">Pendentes há mais de ' + RA.PRAZO_DIAS + ' dias. Ver fila</div></a>' +
      '</div>' +
      '<div class="grid-2 gap-lg"><section class="card card-pad"><h2 class="h3">Manifestações por assunto</h2>' + UI.barrasStatus(cats) +
      '<details class="como"><summary>Ver como tabela</summary>' + tabela(colsGrupo('Assunto'), cats.map(linhaGrupo)) + '</details></section>' +
      '<section class="card card-pad"><h2 class="h3">Bairros com mais registros</h2>' + UI.barras(bairros.map((b) => ({ nome: b.nome, valor: b.total, tip: b.nome + ': ' + b.total + ' registros, ' + b.pendentes + ' pendentes' }))) + '</section></div>' +
      '<section class="card card-pad"><h2 class="h3">Volume mensal</h2>' + UI.colunasMes(RA.Stats.porMes(todas, 8)) + '</section>' +
      '<section class="card card-pad"><div class="row-between"><div><h2 class="h3">Prioridades sugeridas</h2><p class="muted">Assuntos que se repetem no mesmo bairro e ainda estão pendentes.</p></div></div>' +
      (rec.length ? tabelaRecorrentes(rec, true) : UI.vazio('Sem pontos recorrentes', 'Nenhum assunto se repete no mesmo bairro neste período.')) + AVISO_INDICE + '</section>' +
      '<section class="card card-pad"><h2 class="h3">Pendências por órgão responsável</h2>' + tabela([{ t: 'Órgão' }, { t: 'Recebidas', num: 1 }, { t: 'Pendentes', num: 1 }, { t: 'Prazo vencido', num: 1 }, { t: 'Taxa de conclusão', num: 1 }],
        orgaos.map((o) => [esc(o.nome), o.total, o.pendentes, o.atrasadas ? '<strong class="txt-bad">' + o.atrasadas + '</strong>' : '0', chipTaxa(o.taxa)])) + '</section></div>';

    $('#pn-per', main).addEventListener('change', (e) => { estadoPainel.periodo = Number(e.target.value); RA.remontar(main, RA.views.painel); });
  };

  /* ------------------------------ Fila / lista (gestor e Legislativo) ------------------------------ */
  const estadoFila = { q: '', bairro: '', categoria: '', status: '', orgao: '', atrasadas: false, ordem: 'antigas', limite: 25 };

  function csvManifestacoes(lista) {
    const cab = ['Protocolo', 'Tipo', 'Assunto', 'Título', 'Bairro', 'Órgão responsável', 'Situação', 'Registrada em', 'Concluída em', 'Dias até concluir', 'Prazo', 'Apoios', 'Comentários'];
    const linhas = lista.map((m) => [m.protocolo, RA.TIPOS[m.tipo].nome, RA.categoria(m.categoria).nome, m.titulo, m.bairro, m.orgao, RA.STATUS[m.status].nome, UI.data(m.dataCriacao),
      m.dataConclusao ? UI.data(m.dataConclusao) : '', m.dataConclusao ? Math.round(RA.dias(m.dataCriacao, m.dataConclusao)) : '', RA.prazo(m).texto, RA.Stats.apoios(m), m.comentarios.length]);
    return UI.csv([cab].concat(linhas));
  }

  RA.views.fila = function (main, ctx) {
    const user = RA.DB.usuarioAtual();
    const gestor = user.nivel === 'gestor';
    const e = estadoFila;
    const p = ctx.params;
    if (Object.keys(p).length) {
      Object.assign(e, { q: '', bairro: p.bairro || '', categoria: p.categoria || '', status: p.status || '', orgao: p.orgao || '', atrasadas: p.atrasadas === '1', limite: 25 });
      history.replaceState(null, '', '#/fila');
    }

    main.innerHTML = '<div class="container"><div class="page-head row-between"><div><h1 class="h2">' + (gestor ? 'Fila de tratamento' : 'Manifestações registradas') + '</h1>' +
      '<p class="muted">' + (gestor ? 'Abra uma manifestação para alterar a situação, encaminhar ao órgão e responder ao cidadão.' : 'Consulta somente leitura. Dados pessoais e denúncias não são exibidos.') + '</p></div>' +
      '<button type="button" class="btn btn-ghost" id="fl-csv">' + icon('download', 16) + 'Exportar CSV</button></div>' +
      '<form class="filters card" id="f-fila" role="search"><div class="field grow"><label for="fl-q">Buscar</label><input id="fl-q" class="input" type="search" placeholder="Título, protocolo, rua..." value="' + esc(e.q) + '"></div>' +
      '<div class="field"><label for="fl-st">Situação</label><select id="fl-st" class="input"><option value="">Todas</option><option value="pendente"' + (e.status === 'pendente' ? ' selected' : '') + '>Pendentes</option>' + Object.keys(RA.STATUS).map((k) => '<option value="' + k + '"' + (e.status === k ? ' selected' : '') + '>' + RA.STATUS[k].nome + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="fl-cat">Assunto</label><select id="fl-cat" class="input">' + UI.opcoes(RA.CATEGORIAS, e.categoria, 'Todos') + '</select></div>' +
      '<div class="field"><label for="fl-bairro">Bairro</label><select id="fl-bairro" class="input">' + UI.opcoes(RA.BAIRROS, e.bairro, 'Todos') + '</select></div>' +
      '<div class="field"><label for="fl-org">Órgão</label><select id="fl-org" class="input">' + UI.opcoes(RA.ORGAOS, e.orgao, 'Todos') + '</select></div>' +
      '<div class="field"><label for="fl-ord">Ordem</label><select id="fl-ord" class="input"><option value="antigas"' + (e.ordem === 'antigas' ? ' selected' : '') + '>Mais antigas primeiro</option><option value="recentes"' + (e.ordem === 'recentes' ? ' selected' : '') + '>Mais recentes primeiro</option><option value="apoios"' + (e.ordem === 'apoios' ? ' selected' : '') + '>Mais apoiadas</option></select></div>' +
      '<label class="check inline"><input type="checkbox" id="fl-atr"' + (e.atrasadas ? ' checked' : '') + '><span>Só com prazo vencido</span></label></form>' +
      '<p class="result-line" id="fl-resumo" aria-live="polite"></p><div id="fl-lista"></div><div class="center" id="fl-mais"></div></div>';

    let atual = [];
    function pintar() {
      atual = RA.filtrar(RA.DB.manifestacoes(), e);
      $('#fl-resumo', main).innerHTML = '<strong>' + atual.length + '</strong> ' + (atual.length === 1 ? 'manifestação' : 'manifestações') + (e.atrasadas ? ' com prazo vencido' : '') + '.';
      const vis = atual.slice(0, e.limite);
      $('#fl-lista', main).innerHTML = vis.length ? tabela([{ t: 'Protocolo' }, { t: 'Manifestação' }, { t: 'Assunto' }, { t: 'Bairro' }, { t: 'Situação' }, { t: 'Prazo' }, { t: 'Apoios', num: 1 }],
        vis.map((m) => [
          '<span class="mono">' + esc(m.protocolo) + '</span>',
          '<button type="button" class="link-btn" data-detalhe="' + m.id + '">' + esc(m.titulo) + '</button>' + (RA.TIPOS[m.tipo].publica ? '' : ' <span class="chip chip-soft">Denúncia</span>'),
          esc(RA.categoria(m.categoria).nome), esc(m.bairro), UI.statusBadge(m.status), UI.prazoBadge(m), RA.Stats.apoios(m)]), 'tbl-fila') :
        UI.vazio('Nada por aqui', 'Nenhuma manifestação corresponde aos filtros.');
      $('#fl-mais', main).innerHTML = atual.length > vis.length ? '<button type="button" class="btn btn-ghost" id="bt-mais">Mostrar mais (' + (atual.length - vis.length) + ')</button>' : '';
    }
    pintar();

    const f = $('#f-fila', main);
    f.addEventListener('submit', (ev) => ev.preventDefault());
    const mapa = { 'fl-q': 'q', 'fl-st': 'status', 'fl-cat': 'categoria', 'fl-bairro': 'bairro', 'fl-org': 'orgao', 'fl-ord': 'ordem' };
    const lento = UI.debounce(pintar, 200);
    f.addEventListener('input', (ev) => {
      if (ev.target.id === 'fl-atr') { e.atrasadas = ev.target.checked; e.limite = 25; pintar(); return; }
      const k = mapa[ev.target.id];
      if (k) { e[k] = ev.target.value; e.limite = 25; lento(); }
    });
    main.addEventListener('click', (ev) => { if (ev.target.closest('#bt-mais')) { e.limite += 25; pintar(); } });
    $('#fl-csv', main).addEventListener('click', () => {
      UI.baixar('manifestacoes-' + new Date().toISOString().slice(0, 10) + '.csv', csvManifestacoes(atual), 'text/csv;charset=utf-8');
      UI.toast('CSV com ' + atual.length + ' manifestações gerado.', 'ok');
    });
    RA.ligarCartoes(main, pintar);
  };

  /* ------------------------------ Relatórios (UC12) ------------------------------ */
  const TIPOS_REL = {
    categoria: 'Por assunto', bairro: 'Por bairro', status: 'Por situação', orgao: 'Por órgão responsável', tipo: 'Por tipo de manifestação', mensal: 'Evolução mensal',
  };
  const estadoRel = { tipo: 'categoria', periodo: 90, categoria: '', formato: 'pdf' };

  function montarRelatorio(cfg) {
    let base = RA.Stats.periodo(RA.DB.manifestacoes(), cfg.periodo);
    if (cfg.categoria) base = base.filter((m) => m.categoria === cfg.categoria);
    const resumo = RA.Stats.resumo(base);
    let grupos = null; let meses = null;
    if (cfg.tipo === 'categoria') grupos = RA.Stats.porCategoria(base);
    else if (cfg.tipo === 'bairro') grupos = RA.Stats.porBairro(base);
    else if (cfg.tipo === 'status') grupos = RA.Stats.porStatus(base);
    else if (cfg.tipo === 'orgao') grupos = RA.Stats.porOrgao(base);
    else if (cfg.tipo === 'tipo') grupos = RA.Stats.porTipo(base);
    else meses = RA.Stats.porMes(base, 12);
    const concluidas = base.filter((m) => m.status === 'concluida');
    return {
      cfg, base, resumo, grupos, meses,
      rec: RA.Stats.recorrentes(base, 2).slice(0, 5),
      insights: RA.Stats.insights(base),
      providencias: {
        respostas: base.filter((m) => m.resposta).length,
        encaminhadas: base.filter((m) => m.status === 'andamento' || m.status === 'concluida').length,
        noPrazo: concluidas.length - resumo.foraPrazo, fora: resumo.foraPrazo,
      },
    };
  }

  function htmlRelatorio(rel, impressao) {
    const { cfg, resumo: r } = rel;
    let h = '<div class="rel">' + (impressao ? '<header class="rel-cab"><strong>Ouvidoria Municipal de Itapetininga/SP</strong><span>Relatório de gestão de manifestações</span></header>' : '') +
      '<p class="muted">' + esc(TIPOS_REL[cfg.tipo]) + ', ' + esc(nomePeriodo(cfg.periodo).toLowerCase()) + (cfg.categoria ? ', assunto: ' + esc(RA.categoria(cfg.categoria).nome) : '') + '. Gerado em ' + UI.dataHora(new Date().toISOString()) + '.</p>' +
      '<h3>Resumo executivo</h3><div class="kpis kpis-4">' +
      UI.kpi({ rotulo: 'Total', valor: UI.num(r.total), icone: 'message' }) +
      UI.kpi({ rotulo: 'Abertas e em análise', valor: UI.num(r.aberta + r.analise), tom: 'bad', icone: 'alert' }) +
      UI.kpi({ rotulo: 'Em andamento', valor: UI.num(r.andamento), tom: 'warn', icone: 'clock' }) +
      UI.kpi({ rotulo: 'Concluídas', valor: UI.num(r.concluida), tom: 'ok', icone: 'check', dica: UI.pct(r.taxa) + ' do total' }) + '</div>';
    if (rel.meses) {
      h += '<h3>Evolução mensal</h3>' + UI.colunasMes(rel.meses) + '<h3>Dados detalhados</h3>' +
        tabela([{ t: 'Mês' }, { t: 'Recebidas', num: 1 }, { t: 'Concluídas', num: 1 }], rel.meses.map((m) => [esc(m.nome + ' de ' + m.ano), m.recebidas, m.concluidas]));
    } else {
      h += '<h3>Distribuição</h3>' + UI.barrasStatus(rel.grupos.filter((g) => g.total)) + '<h3>Dados detalhados</h3>' + tabela(colsGrupo(TIPOS_REL[cfg.tipo].replace('Por ', '').replace(/^./, (c) => c.toUpperCase())), rel.grupos.map(linhaGrupo));
    }
    h += '<h3>Pontos recorrentes</h3>' + (rel.rec.length ? tabelaRecorrentes(rel.rec, false) : '<p class="muted">Nenhum assunto pendente se repete no mesmo bairro neste recorte.</p>');
    h += '<h3>Providências adotadas</h3><ul class="ticks"><li>' + rel.providencias.respostas + ' manifestações com resposta oficial registrada.</li><li>' + rel.providencias.encaminhadas + ' encaminhadas aos órgãos responsáveis ou já concluídas.</li>' +
      '<li>' + rel.providencias.noPrazo + ' concluídas dentro do prazo de ' + RA.PRAZO_DIAS + ' dias e ' + rel.providencias.fora + ' fora do prazo.</li><li>' + r.atrasadas + ' pendentes com prazo vencido.</li></ul>';
    h += '<div class="insights"><h3>' + icon('chart', 18) + 'Análise e insights</h3><ul class="ticks">' + rel.insights.map((i) => '<li class="in-' + i.tom + '">' + esc(i.texto) + '</li>').join('') + '</ul></div>';
    h += '<p class="rel-nota">Dados fictícios gerados por um protótipo acadêmico. Os indicadores subsidiam a gestão e a fiscalização, mas não substituem a análise técnica nem a decisão administrativa.</p></div>';
    return h;
  }

  function csvRelatorio(rel) {
    const cab = [['Relatório de gestão', TIPOS_REL[rel.cfg.tipo]], ['Período', nomePeriodo(rel.cfg.periodo)], ['Total', rel.resumo.total], ['Concluídas', rel.resumo.concluida], ['Taxa de conclusão', UI.pct(rel.resumo.taxa)], ['Tempo médio (dias)', rel.resumo.mediaDias == null ? '' : UI.dec(rel.resumo.mediaDias)], []];
    const corpo = rel.meses ? [['Mês', 'Recebidas', 'Concluídas']].concat(rel.meses.map((m) => [m.nome + ' de ' + m.ano, m.recebidas, m.concluidas]))
      : [['Grupo', 'Total', 'Abertas', 'Em análise', 'Em andamento', 'Concluídas', 'Taxa', 'Tempo médio (dias)']].concat(rel.grupos.map((g) => [g.nome, g.total, g.aberta, g.analise, g.andamento, g.concluida, UI.pct(g.taxa), g.mediaDias == null ? '' : UI.dec(g.mediaDias)]));
    return UI.csv(cab.concat(corpo));
  }

  RA.views.relatorios = function (main) {
    const e = estadoRel;
    const todas = RA.DB.manifestacoes();
    const r = RA.Stats.resumo(todas);
    main.innerHTML = '<div class="container narrow-lg"><div class="page-head"><h1 class="h2">Relatórios</h1><p class="muted">Consolide as manifestações em informação para decidir e fiscalizar.</p></div>' +

      '<form class="card card-pad" id="f-rel"><h2 class="h3">Filtros do relatório</h2><div class="grid-2">' +

  function modalNotificacaoMassa(aoFim) {
    const h = UI.modal(UI.cabecalhoModal('Enviar notificação', 'Escolha quem recebe e escreva a mensagem.') + '<form class="modal-b" id="f-massa" novalidate>' +
      '<div class="grid-2"><div class="field"><label for="ms-dest">Destinatários</label><select id="ms-dest" class="input"><option value="todos">Todos os cidadãos</option><option value="bairro">Cidadãos de um bairro</option><option value="pendentes">Cidadãos com manifestação pendente</option></select></div>' +
      '<div class="field" id="ms-b" hidden><label for="ms-bairro">Bairro</label><select id="ms-bairro" class="input">' + UI.opcoes(RA.BAIRROS, '') + '</select></div></div>' +
      '<div class="field"><label for="ms-txt">Mensagem</label><textarea id="ms-txt" class="input" rows="4" maxlength="500" placeholder="Ex.: A coleta de lixo do bairro será normalizada a partir de segunda-feira."></textarea><p class="hint" id="ms-c"></p></div>' +
      '<p class="muted" id="ms-n"></p><div class="modal-f flush"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button type="submit" class="btn btn-primary">' + icon('send', 16) + 'Enviar notificação</button></div></form>', { size: 'md', title: 'Enviar notificação' });
    const f = $('#f-massa', h.el);
    UI.contador($('#ms-txt', f), $('#ms-c', f), 0, 500);
    const alvo = () => {
      const t = $('#ms-dest', f).value;
      const cid = RA.DB.usuarios().filter((u) => u.nivel === 'cidadao' && u.status === 'ativo');
      if (t === 'bairro') return cid.filter((u) => u.bairro === $('#ms-bairro', f).value);
      if (t === 'pendentes') { const ids = new Set(RA.DB.manifestacoes().filter((m) => m.status !== 'concluida').map((m) => m.autorId)); return cid.filter((u) => ids.has(u.id)); }
      return cid;
    };
    const atualizar = () => { $('#ms-b', f).hidden = $('#ms-dest', f).value !== 'bairro'; $('#ms-n', f).textContent = alvo().length + ' ' + (alvo().length === 1 ? 'pessoa receberá' : 'pessoas receberão') + ' esta notificação.'; };

    atualizar();

      e.preventDefault();

      h.close();
      UI.toast('Notificação enviada para ' + a.length + (a.length === 1 ? ' pessoa.' : ' pessoas.'), 'ok');
      if (aoFim) aoFim();
    });
  }

  /* ------------------------------ Fiscalização (Legislativo) ------------------------------ */
  const estadoFisc = { periodo: 0 };
  RA.views.fiscalizacao = function (main) {
    const todas = RA.DB.manifestacoes();
    const base = RA.Stats.periodo(todas, estadoFisc.periodo);
    const r = RA.Stats.resumo(base);
    const orgaos = RA.Stats.porOrgao(base).sort((a, b) => b.atrasadas - a.atrasadas || b.pendentes - a.pendentes);
    const rec = RA.Stats.recorrentes(base, 2).slice(0, 8);
    const bairros = RA.Stats.porBairro(base).slice(0, 8);
    const apoiadas = base.filter((m) => m.status !== 'concluida' && RA.TIPOS[m.tipo].publica).sort((a, b) => RA.Stats.apoios(b) - RA.Stats.apoios(a)).slice(0, 5);

    main.innerHTML = '<div class="container"><div class="page-head row-between"><div><h1 class="h2">Painel de fiscalização</h1><p class="muted">O que a população relata e como o Executivo responde. Dados agregados, sem identificação de cidadãos.</p></div>' +
      '<div class="field inline"><label for="fs-per">Período</label><select id="fs-per" class="input">' + optPeriodo(estadoFisc.periodo) + '</select></div></div>' +
      '<div class="note note-wide">' + icon('info', 18) + '<p>Os números abaixo são um subsídio para perguntar, requerer informações e acompanhar o serviço público. Eles mostram o que foi relatado, não substituem laudos técnicos nem a análise de orçamento e prioridades da administração.</p></div>' +
      '<div class="kpis kpis-5">' +
      UI.kpi({ rotulo: 'Manifestações recebidas', valor: UI.num(r.total), icone: 'message' }) +
      UI.kpi({ rotulo: 'Taxa de conclusão', valor: UI.pct(r.taxa), tom: r.taxa >= 0.6 ? 'ok' : 'warn', icone: 'check', dica: r.concluida + ' concluídas' }) +
      UI.kpi({ rotulo: 'Tempo médio de resolução', valor: r.mediaDias == null ? '-' : UI.dec(r.mediaDias) + ' dias', icone: 'clock', dica: 'Prazo legal de ' + RA.PRAZO_DIAS + ' dias' }) +
      UI.kpi({ rotulo: 'Pendentes', valor: UI.num(r.pendentes), tom: 'bad', icone: 'alert' }) +
      '<a class="kpi kpi-link' + (r.atrasadas ? ' kpi-bad' : '') + '" href="' + link('fila', { atrasadas: 1 }) + '"><div class="kpi-top"><span class="kpi-l">Prazo vencido</span>' + icon('clock', 18) + '</div><div class="kpi-v">' + UI.num(r.atrasadas) + '</div><div class="kpi-h">Ver manifestações</div></a></div>' +
      '<section class="card card-pad"><h2 class="h3">Resposta por órgão responsável</h2><p class="muted">Ordenado por manifestações com prazo vencido.</p>' + tabela([{ t: 'Órgão' }, { t: 'Recebidas', num: 1 }, { t: 'Pendentes', num: 1 }, { t: 'Prazo vencido', num: 1 }, { t: 'Concluídas', num: 1 }, { t: 'Taxa', num: 1 }, { t: 'Tempo médio', num: 1 }],
        orgaos.map((o) => [esc(o.nome), o.total, o.pendentes, o.atrasadas ? '<strong class="txt-bad">' + o.atrasadas + '</strong>' : '0', o.concluida, chipTaxa(o.taxa), tempo(o.mediaDias)])) + '</section>' +
      '<section class="card card-pad"><h2 class="h3">Pontos recorrentes</h2><p class="muted">Mesmo assunto, mesmo bairro, ainda sem solução.</p>' + (rec.length ? tabelaRecorrentes(rec, true) : UI.vazio('Sem pontos recorrentes', '')) + AVISO_INDICE + '</section>' +
      '<div class="grid-2 gap-lg"><section class="card card-pad"><h2 class="h3">Bairros com mais registros</h2>' + UI.barras(bairros.map((b) => ({ nome: b.nome, valor: b.total, tip: b.nome + ': ' + b.total + ' registros, ' + b.pendentes + ' pendentes' }))) + '</section>' +
      '<section class="card card-pad"><h2 class="h3">Mais apoiadas e ainda abertas</h2>' + (apoiadas.length ? '<ul class="feed">' + apoiadas.map((m) => '<li><button type="button" class="feed-btn" data-detalhe="' + m.id + '"><strong>' + esc(m.titulo) + '</strong><span class="muted">' + esc(m.bairro) + ', ' + RA.Stats.apoios(m) + ' apoios, ' + esc(RA.STATUS[m.status].nome) + '</span></button></li>').join('') + '</ul>' : UI.vazio('Nada pendente', '')) + '</section></div>' +
      '<div class="btn-row"><a class="btn btn-primary" href="#/relatorios">' + icon('file', 16) + 'Gerar relatório</a><a class="btn btn-ghost" href="#/fila">' + icon('list', 16) + 'Ver todas as manifestações</a></div></div>';
    $('#fs-per', main).addEventListener('change', (e) => { estadoFisc.periodo = Number(e.target.value); RA.remontar(main, RA.views.fiscalizacao); });
    RA.ligarCartoes(main);
  };
})();

</script>
  <script>
/* =========================================================================
   Resolve Aqui - roteador, cabeçalho, rodapé e preferências
   ========================================================================= */
(function () {
  'use strict';
  const RA = window.RA;
  const UI = RA.UI;
  const esc = UI.esc;
  const icon = UI.icon;
  const $ = UI.$;

  const ROTAS = {
    '': { v: 'inicio', t: 'Início' },
    entrar: { v: 'entrar', t: 'Entrar', semLogin: true },
    cadastro: { v: 'cadastro', t: 'Criar conta', semLogin: true },
    recuperar: { v: 'recuperar', t: 'Recuperar acesso', semLogin: true },
    protocolo: { v: 'protocolo', t: 'Consultar protocolo' },
    nova: { v: 'nova', t: 'Nova manifestação', niveis: ['cidadao'] },
    regiao: { v: 'regiao', t: 'Manifestações na região', niveis: ['cidadao'] },
    conta: { v: 'conta', t: 'Minha conta', niveis: ['cidadao'] },
    painel: { v: 'painel', t: 'Painel da ouvidoria', niveis: ['gestor'] },
    fila: { v: 'fila', t: 'Manifestações', niveis: ['gestor', 'vereador'] },
    relatorios: { v: 'relatorios', t: 'Relatórios', niveis: ['gestor', 'vereador'] },
    usuarios: { v: 'usuarios', t: 'Usuários', niveis: ['gestor'] },
    avaliacoes: { v: 'avaliacoes', t: 'Avaliações do protótipo', niveis: ['gestor'] },
    fiscalizacao: { v: 'fiscalizacao', t: 'Painel de fiscalização', niveis: ['vereador'] },
  };

  const NAV = {
    anonimo: [['', 'Início', 'home'], ['protocolo', 'Consultar protocolo', 'search'], ['entrar', 'Entrar', 'user'], ['cadastro', 'Criar conta', 'plus']],
    cidadao: [['nova', 'Nova manifestação', 'plus'], ['regiao', 'Na minha região', 'pin'], ['protocolo', 'Consultar protocolo', 'search'], ['conta', 'Minha conta', 'user']],
    gestor: [['painel', 'Painel', 'chart'], ['fila', 'Fila', 'list'], ['relatorios', 'Relatórios', 'file'], ['usuarios', 'Usuários', 'users'], ['avaliacoes', 'Avaliações', 'star']],
    vereador: [['fiscalizacao', 'Fiscalização', 'landmark'], ['fila', 'Manifestações', 'list'], ['relatorios', 'Relatórios', 'file']],
  };
  const PERFIL = { cidadao: 'Cidadão', gestor: 'Ouvidoria', vereador: 'Legislativo' };

  /* ------------------------------ Preferências ------------------------------ */
  const pref = {
    ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    gravar(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignora */ } },
  };
  function aplicarPreferencias() {
    const t = pref.ler('resolveaqui.tema');
    if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : 'light');
    document.documentElement.setAttribute('data-fs', pref.ler('resolveaqui.fonte') || '0');
  }
  function temaEscuroAtivo() {
    const a = document.documentElement.getAttribute('data-theme');
    return a ? a === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  /* ------------------------------ Cabeçalho e rodapé ------------------------------ */
  const MARCA = '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="currentColor" opacity=".18"/><path d="M8 10.5A2.5 2.5 0 0 1 10.5 8h13A2.5 2.5 0 0 1 26 10.5v9a2.5 2.5 0 0 1-2.5 2.5H15l-5 4v-4h-.5A1.5 1.5 0 0 1 8 20.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m13 15.2 2.7 2.7 5.3-5.4" fill="none" stroke="#f2a516" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function caminhoAtual() { return location.hash.replace(/^#\/?/, '').split('?')[0]; }

  function renderCabecalho() {
    const user = RA.DB.usuarioAtual();
    const nav = NAV[user ? user.nivel : 'anonimo'];
    const atual = caminhoAtual();
    const naoLidas = user ? RA.DB.notificacoesDe(user.id).filter((n) => !n.lida).length : 0;
    $('#site-header').innerHTML = '<div class="container hdr-in"><a class="brand" href="#/" aria-label="Resolve Aqui, página inicial">' + MARCA +
      '<span class="brand-t"><strong>Resolve Aqui</strong><small>Ouvidoria digital de Itapetininga</small></span></a>' +
      '<nav class="nav" aria-label="Principal">' + nav.map((n) => '<a href="#/' + n[0] + '"' + (atual === n[0] ? ' aria-current="page"' : '') + '>' + icon(n[2], 17) + '<span>' + n[1] + '</span></a>').join('') + '</nav>' +
      '<div class="hdr-act">' +
      (user ? '<button type="button" class="icon-btn hd" id="hd-bell" aria-label="Notificações' + (naoLidas ? ', ' + naoLidas + ' novas' : '') + '">' + icon('bell', 19) + (naoLidas ? '<span class="dot-n">' + naoLidas + '</span>' : '') + '</button>' : '') +
      '<button type="button" class="icon-btn hd" id="hd-fonte" aria-label="Alterar tamanho do texto" data-tip="Tamanho do texto"><span class="aa" aria-hidden="true">Aa</span></button>' +
      '<button type="button" class="icon-btn hd" id="hd-tema" aria-label="' + (temaEscuroAtivo() ? 'Usar tema claro' : 'Usar tema escuro') + '">' + icon(temaEscuroAtivo() ? 'sun' : 'moon', 19) + '</button>' +
      (user ? '<div class="who"><span class="who-n">' + esc(user.nome.split(' ')[0]) + '<small>' + PERFIL[user.nivel] + '</small></span><button type="button" class="btn btn-onDark btn-sm" id="hd-sair">' + icon('logout', 16) + 'Sair</button></div>' : '') +
      '</div></div>';
  }
  RA.atualizarCabecalho = renderCabecalho;

  function renderRodape() {
    $('#site-footer').innerHTML = '<div class="container ftr-in"><p><strong>Protótipo acadêmico.</strong> Trabalho de graduação do curso de Análise e Desenvolvimento de Sistemas, Fatec Itapetininga. Todos os dados são fictícios e ficam apenas neste navegador.</p>' +
      '<div class="ftr-act"><button type="button" class="link-btn" id="ft-aval">Avaliar o protótipo</button><button type="button" class="link-btn" id="ft-sobre">Sobre o protótipo</button><button type="button" class="link-btn" id="ft-reset">Restaurar dados de demonstração</button></div></div>' +
      (RA.DB.persistiu() ? '' : '<p class="ftr-aviso container">O navegador bloqueou o armazenamento local. As alterações não serão mantidas ao recarregar.</p>');
  }

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'hd-sair') { RA.DB.sair(); UI.toast('Você saiu da conta.', 'info'); location.hash = '#/'; renderCabecalho(); }
    else if (b.id === 'hd-bell') RA.abrirNotificacoes();
    else if (b.id === 'hd-tema') {
      const escuro = !temaEscuroAtivo();
      document.documentElement.setAttribute('data-theme', escuro ? 'dark' : 'light');
      pref.gravar('resolveaqui.tema', escuro ? 'escuro' : 'claro');
      renderCabecalho();
    } else if (b.id === 'hd-fonte') {
      const n = ((Number(document.documentElement.getAttribute('data-fs')) || 0) + 1) % 3;
      document.documentElement.setAttribute('data-fs', String(n));
      pref.gravar('resolveaqui.fonte', String(n));
      UI.toast('Tamanho do texto: ' + ['normal', 'grande', 'muito grande'][n] + '.', 'info');
    } else if (b.id === 'ft-aval') RA.abrirAvaliacao();
    else if (b.id === 'ft-sobre') abrirSobre();
    else if (b.id === 'ft-reset') {
      if (await UI.confirmar({ titulo: 'Restaurar dados de demonstração?', mensagem: 'Todas as manifestações, usuários e avaliações criados neste navegador serão apagados e os dados fictícios originais voltam.', ok: 'Restaurar', perigo: true })) {
        RA.DB.reiniciar();
        UI.toast('Dados de demonstração restaurados.', 'ok');
        if (caminhoAtual() === '') route(); else location.hash = '#/';
      }
    }
  });

  function abrirSobre() {
    UI.modal(UI.cabecalhoModal('Sobre o protótipo', 'Plataforma digital para ouvidoria e gestão de reclamações de serviços públicos municipais') + '<div class="modal-b">' +
      '<p>Este protótipo funcional apoia o trabalho de graduação de Gustavo Lepinsk Carvalho (Fatec Itapetininga). Ele junta o sistema Resolve Aqui, documentado em Engenharia de Software II, ao problema de pesquisa: <em>em que medida uma plataforma web que estrutura os relatos da população pode organizar as informações e subsidiar decisões da administração municipal e a fiscalização do Legislativo?</em></p>' +
      '<h3>Onde ver cada objetivo</h3><ul class="ticks">' +
      '<li><strong>Categorias de falhas e demandas:</strong> nove assuntos e cinco tipos de manifestação da Lei nº 13.460/2017, em Nova manifestação e no Painel.</li>' +
      '<li><strong>Registro, classificação, consulta e gerenciamento:</strong> Nova manifestação, Na minha região, Consultar protocolo e Fila de tratamento.</li>' +
      '<li><strong>Organização das informações:</strong> Painel da ouvidoria, Relatórios e pontos recorrentes com índice de prioridade.</li>' +
      '<li><strong>Subsídio à fiscalização:</strong> Painel de fiscalização do Legislativo, com prazos e respostas por órgão.</li>' +
      '<li><strong>Testes e validações:</strong> questionário de usabilidade em Avaliar o protótipo.</li></ul>' +
      '<h3>Limites do protótipo</h3><ul class="ticks"><li>Os dados ficam no localStorage do navegador. A versão final usaria um servidor e um banco SQL.</li>' +
      '<li>O e-mail de confirmação e o de recuperação são simulados na tela.</li><li>As senhas ficam sem criptografia, só para demonstração. Não use senhas reais.</li><li>A integração com o gov.br e a geolocalização por mapa não estão ativas.</li><li>Órgãos, bairros e números são ilustrativos.</li></ul></div>' +
      '<div class="modal-f"><button type="button" class="btn btn-primary" data-close>Entendi</button></div>', { size: 'lg', title: 'Sobre o protótipo' });
  }

  /* ------------------------------ Roteador ------------------------------ */
  function parse() {
    const h = location.hash.replace(/^#\/?/, '');
    const i = h.indexOf('?');
    const caminho = i >= 0 ? h.slice(0, i) : h;
    const params = {};
    new URLSearchParams(i >= 0 ? h.slice(i + 1) : '').forEach((v, k) => { params[k] = v; });
    return { caminho, params };
  }

  function route() {
    UI.fecharTodos();
    const { caminho, params } = parse();
    const def = ROTAS[caminho];
    const user = RA.DB.usuarioAtual();
    const main = $('#main');
    if (def) {
      if (def.niveis && !user) { UI.toast('Entre na sua conta para continuar.', 'info'); location.hash = '#/entrar'; return; }
      if (def.niveis && def.niveis.indexOf(user.nivel) < 0) { location.hash = RA.homeDoNivel(user.nivel); return; }
      if (def.semLogin && user) { location.hash = RA.homeDoNivel(user.nivel); return; }
    }
    main.innerHTML = '';
    const view = document.createElement('div');
    main.appendChild(view);
    if (!def) {
      view.innerHTML = '<div class="container narrow"><div class="card card-pad">' + UI.vazio('Página não encontrada', 'O endereço não existe neste protótipo.', '<a class="btn btn-primary" href="#/">Voltar ao início</a>') + '</div></div>';
      document.title = 'Página não encontrada | Resolve Aqui';
    } else {
      document.title = def.t + ' | Resolve Aqui';
      try { RA.views[def.v](view, { params, user }); }
      catch (err) {
        console.error(err);
        view.innerHTML = '<div class="container narrow"><div class="card card-pad">' + UI.vazio('Algo deu errado ao abrir esta tela', 'Recarregue a página. Se continuar, use "Restaurar dados de demonstração" no rodapé.') + '</div></div>';
      }
    }
    renderCabecalho();
    window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
  }

  window.addEventListener('hashchange', route);
  document.addEventListener('DOMContentLoaded', () => {
    RA.DB.iniciar();
    aplicarPreferencias();
    renderRodape();
    route();
  });
})();

</script>
