/* =========================================================================
   Resolve Aqui - folha de estilos do protótipo
   Tema claro/escuro (automático ou escolhido), tamanho de texto ajustável,
   layout responsivo e impressão de relatórios.
   ========================================================================= */

/* ------------------------------ Tokens ------------------------------ */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #f0f3fa;
  --ink: #141c33;
  --muted: #566079;
  --line: #dde2ee;
  --brand: #1d4ed8;
  --brand-ink: #ffffff;
  --brand-tint: #e8eeff;
  --brand-deep: #0f2a66;
  --accent: #f2a516;
  --focus: #1d4ed8;
  --ok: #15704a;       --ok-bg: #e2f5ea;
  --warn: #8a5600;     --warn-bg: #fff2d3;
  --bad: #b3261e;      --bad-bg: #fdeceb;
  --viol: #5b3fc4;     --viol-bg: #eeeaff;
  --st-aberta: #d6453a;   --st-analise: #7a5ad8;   --st-andamento: #e09b00;   --st-concluida: #1f9d63;
  --shadow: 0 1px 2px rgba(20, 28, 51, .06), 0 4px 14px rgba(20, 28, 51, .06);
  --shadow-lg: 0 20px 50px rgba(10, 18, 40, .35);
  --radius: .85rem;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
/* Variáveis do tema escuro: declaradas uma vez por seletor (automático e manual) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d1322; --surface: #151d33; --surface-2: #1b2540; --ink: #e8ecf8; --muted: #9ba6c2; --line: #2a3555;
    --brand: #6f9bff; --brand-ink: #0b1226; --brand-tint: #1d2c57; --brand-deep: #0a1533; --focus: #9bbcff;
    --ok: #5fd39a; --ok-bg: #12301f; --warn: #f2c15a; --warn-bg: #3a2c0a; --bad: #ff8f86; --bad-bg: #3a1614; --viol: #b9a6ff; --viol-bg: #271f4d;
    --st-aberta: #ff7a6e; --st-analise: #a891ff; --st-andamento: #f2b93b; --st-concluida: #4cc58b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1322; --surface: #151d33; --surface-2: #1b2540; --ink: #e8ecf8; --muted: #9ba6c2; --line: #2a3555;
  --brand: #6f9bff; --brand-ink: #0b1226; --brand-tint: #1d2c57; --brand-deep: #0a1533; --focus: #9bbcff;
  --ok: #5fd39a; --ok-bg: #12301f; --warn: #f2c15a; --warn-bg: #3a2c0a; --bad: #ff8f86; --bad-bg: #3a1614; --viol: #b9a6ff; --viol-bg: #271f4d;
  --st-aberta: #ff7a6e; --st-analise: #a891ff; --st-andamento: #f2b93b; --st-concluida: #4cc58b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
}

/* ------------------------------ Base ------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; scroll-padding-top: 5rem; }
html[data-fs="1"] { font-size: 112.5%; }
html[data-fs="2"] { font-size: 125%; }
body { margin: 0; font-family: var(--font); line-height: 1.5; color: var(--ink); background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
body.no-scroll { overflow: hidden; }
main { flex: 1; padding-block: 1.5rem 3rem; outline: none; }
h1, h2, h3, p, ul, ol, figure, fieldset, dl { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); line-height: 1.15; letter-spacing: -.02em; }
h2, .h2 { font-size: 1.55rem; line-height: 1.2; letter-spacing: -.01em; }
h3, .h3 { font-size: 1.08rem; line-height: 1.3; }
a { color: var(--brand); text-underline-offset: .15em; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: .25rem; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: .5rem; top: -4rem; background: var(--surface); color: var(--ink); padding: .6rem 1rem; border-radius: .5rem; z-index: 100; box-shadow: var(--shadow); }
.skip:focus { top: .5rem; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: .9em; }
.pre { white-space: pre-line; overflow-wrap: anywhere; }
.txt-bad { color: var(--bad); }
.i { flex: none; vertical-align: -.2em; }
.lead { font-size: 1.15rem; line-height: 1.55; }
.sm { font-size: .95rem; }
.center { display: flex; justify-content: center; text-align: center; }

/* ------------------------------ Layout ------------------------------ */
.container { width: 100%; max-width: 74rem; margin-inline: auto; padding-inline: 1rem; }
.container.narrow { max-width: 36rem; }
.container.narrow-lg { max-width: 54rem; }
.container > * + *, #aba > * + * { margin-top: 1.25rem; }
.container > .page-head + * { margin-top: 1.25rem; }
.page-head > * + * { margin-top: .3rem; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.row-between > div > * + * { margin-top: .3rem; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.gap-lg { gap: 1.25rem; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 1.25rem; align-items: start; }
.side { display: grid; gap: 1.25rem; position: sticky; top: 5.5rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: .6rem; }
.btn-row.center { justify-content: center; }
.sec { padding-block: 2.2rem; }
.sec-head { margin-bottom: 1.2rem; }
.sec-head > * + * { margin-top: .25rem; }
.band { background: var(--surface); border-block: 1px solid var(--line); margin-block: 1rem; }
.title-row { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem .75rem; }
.title-row h2, .title-row h3 { overflow-wrap: anywhere; }
@media (max-width: 62rem) { .split { grid-template-columns: 1fr; } .side { position: static; } }
@media (max-width: 40rem) { .grid-2, .grid-3 { grid-template-columns: 1fr; } main { padding-block: 1rem 2.5rem; } }

/* ------------------------------ Cabeçalho e rodapé ------------------------------ */
.site-header { position: sticky; top: 0; z-index: 30; background: linear-gradient(100deg, var(--brand-deep), #17409c); color: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .2); }
.hdr-in { display: flex; align-items: center; gap: .75rem 1rem; padding-block: .6rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: .6rem; color: #fff; text-decoration: none; color: #fff; }
.brand svg { color: #fff; }
.brand-t { display: flex; flex-direction: column; line-height: 1.15; }
.brand-t strong { font-size: 1.12rem; letter-spacing: -.01em; }
.brand-t small { font-size: .74rem; opacity: .8; }
.nav { display: flex; gap: .25rem; flex: 1; flex-wrap: wrap; }
.nav a { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem .65rem; white-space: nowrap; border-radius: .6rem; color: #fff; text-decoration: none; font-size: .93rem; font-weight: 500; opacity: .88; }
.nav a:hover { background: rgba(255, 255, 255, .12); opacity: 1; }
.nav a[aria-current="page"] { background: rgba(255, 255, 255, .18); opacity: 1; box-shadow: inset 0 -3px 0 var(--accent); }
.hdr-act { display: flex; align-items: center; gap: .35rem; margin-left: auto; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: .6rem; border: 0; background: transparent; color: inherit; }
.icon-btn:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
.icon-btn.hd { color: #fff; }
.icon-btn.hd:hover { background: rgba(255, 255, 255, .15); }
.icon-btn.perigo { color: var(--bad); }
.aa { font-weight: 700; font-size: .95rem; letter-spacing: -.03em; }
.dot-n { position: absolute; top: .1rem; right: .05rem; min-width: 1.1rem; height: 1.1rem; padding-inline: .25rem; border-radius: 1rem; background: var(--accent); color: #1d1400; font-size: .7rem; font-weight: 800; display: grid; place-items: center; }
.who { display: flex; align-items: center; gap: .6rem; margin-left: .4rem; padding-left: .8rem; border-left: 1px solid rgba(255, 255, 255, .25); }
.who-n { display: flex; flex-direction: column; line-height: 1.15; font-weight: 600; font-size: .92rem; }
.who-n small { font-weight: 400; opacity: .8; font-size: .72rem; }
@media (max-width: 52rem) { .nav { order: 3; flex-basis: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: .2rem; } .nav a span { white-space: nowrap; } .who-n { display: none; } .brand-t small { display: none; } }

.site-footer { border-top: 1px solid var(--line); background: var(--surface); padding-block: 1.25rem; font-size: .88rem; color: var(--muted); }
.ftr-in { display: flex; justify-content: space-between; gap: 1rem 2rem; flex-wrap: wrap; align-items: flex-start; }
.ftr-in p { max-width: 42rem; }
.ftr-act { display: flex; gap: 1rem; flex-wrap: wrap; }
.ftr-aviso { margin-top: .6rem; color: var(--bad); }
.link-btn { background: none; border: 0; padding: 0; color: var(--brand); text-decoration: underline; text-underline-offset: .15em; text-align: left; font-size: inherit; }
.link-btn:hover { text-decoration-thickness: 2px; }

/* ------------------------------ Botões ------------------------------ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 2.6rem; padding: .55rem 1.05rem; border: 1px solid transparent; border-radius: .65rem; font-weight: 600; font-size: .95rem; text-decoration: none; line-height: 1.2; transition: background .15s, border-color .15s, transform .05s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.btn-ghost.perigo { color: var(--bad); }
.btn-ghost.is-on { background: var(--brand-tint); border-color: var(--brand); color: var(--brand); }
.btn-primary.is-on { background: var(--ok); color: #fff; }
.btn-danger { background: #c8261c; color: #fff; }
.btn-danger:hover { background: #a81d15; }
.btn-warn { background: #d99a06; color: #1d1400; }
.btn-warn:hover { background: #bd8503; }
.btn-onDark { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .45); }
.btn-onDark:hover { background: rgba(255, 255, 255, .15); }
.btn-sm { min-height: 2.2rem; padding: .35rem .75rem; font-size: .88rem; }
.btn-lg { min-height: 3rem; padding: .7rem 1.35rem; font-size: 1.02rem; }
.btn-block { width: 100%; }
.btn[disabled], .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.chip-btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 2rem; padding: .15rem .65rem; font-size: .8rem; font-family: var(--mono); margin: .15rem .25rem .15rem 0; }
.chip-btn:hover { border-color: var(--brand); color: var(--brand); }

/* ------------------------------ Formulários ------------------------------ */
.field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
.field.inline { flex-direction: row; align-items: center; gap: .6rem; }
.field.grow { flex: 1 1 14rem; }
label, .label { font-weight: 600; font-size: .92rem; }
.input { width: 100%; min-height: 2.6rem; padding: .55rem .75rem; border: 1px solid color-mix(in srgb, var(--ink) 28%, var(--line)); border-radius: .6rem; background: var(--surface); color: var(--ink); }
textarea.input { resize: vertical; min-height: 5rem; line-height: 1.45; }
.input::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
.input:hover { border-color: color-mix(in srgb, var(--ink) 45%, var(--line)); }
.input[readonly] { background: var(--surface-2); color: var(--muted); }
[aria-invalid="true"] { border-color: var(--bad) !important; box-shadow: 0 0 0 1px var(--bad); }
.hint { font-size: .82rem; color: var(--muted); }
.field-err { color: var(--bad); font-size: .86rem; font-weight: 500; margin-top: .3rem; }
form:not(.filters):not(.row-form):not(.ticket) > * + * { margin-top: 1rem; }
.modal-b form > * + *, form.modal-b > * + * { margin-top: 1rem; }
.pw { position: relative; }
.pw .input { padding-right: 5rem; }
.pw-btn { position: absolute; right: .35rem; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--brand); font-size: .84rem; font-weight: 600; padding: .35rem .5rem; }
.check { display: flex; gap: .65rem; align-items: flex-start; font-size: .9rem; font-weight: 400; line-height: 1.45; }
.check input { margin-top: .2rem; width: 1.1rem; height: 1.1rem; flex: none; accent-color: var(--brand); }
.check.inline { align-items: center; padding-bottom: .55rem; }
.filters { display: flex; flex-wrap: wrap; gap: .75rem 1rem; align-items: flex-end; padding: 1rem; }
.filters .field { flex: 0 1 11rem; }
.filters .field.grow { flex: 1 1 14rem; }
.row-form { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
.result-line { color: var(--muted); font-size: .92rem; }
.result-line strong { color: var(--ink); }

fieldset.seg { border: 0; min-width: 0; }
fieldset.seg legend { font-weight: 600; font-size: .92rem; margin-bottom: .5rem; padding: 0; }
.seg-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: .6rem; }
.seg-opt { position: relative; display: block; font-weight: 400; }
.seg-opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.seg-opt span { display: flex; flex-direction: column; gap: .15rem; height: 100%; padding: .65rem .8rem; border: 1px solid var(--line); border-radius: .7rem; background: var(--surface); }
.seg-opt strong { font-size: .95rem; }
.seg-opt small { color: var(--muted); font-size: .78rem; line-height: 1.35; }
.seg-opt input:checked + span { border-color: var(--brand); background: var(--brand-tint); box-shadow: 0 0 0 1px var(--brand); }
.seg-opt input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

.drop { display: flex; align-items: center; gap: .9rem; padding: 1rem; border: 2px dashed color-mix(in srgb, var(--ink) 25%, var(--line)); border-radius: .8rem; background: var(--surface-2); cursor: pointer; font-weight: 400; }
.drop span { display: flex; flex-direction: column; }
.drop small { color: var(--muted); font-size: .8rem; }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-tint); }
.prev { display: grid; gap: .5rem; margin-top: .5rem; }
.prev:empty { display: none; }
.prev li { display: flex; align-items: center; gap: .7rem; padding: .4rem .5rem; border: 1px solid var(--line); border-radius: .6rem; background: var(--surface); }
.prev img { width: 3rem; height: 3rem; object-fit: cover; border-radius: .4rem; }
.prev-ico { width: 3rem; height: 3rem; display: grid; place-items: center; background: var(--surface-2); border-radius: .4rem; color: var(--muted); }
.prev-n { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .9rem; display: flex; flex-direction: column; }
.prev-n small { color: var(--muted); font-size: .76rem; }

.likert { border: 0; min-width: 0; padding: .8rem 0; border-bottom: 1px solid var(--line); }
.likert legend { font-weight: 600; font-size: .95rem; padding: 0; margin-bottom: .55rem; }
.likert-opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; }
.likert-opts label { position: relative; font-weight: 400; }
.likert-opts input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.likert-opts span { display: flex; flex-direction: column; align-items: center; gap: .15rem; text-align: center; height: 100%; padding: .5rem .25rem; border: 1px solid var(--line); border-radius: .6rem; background: var(--surface); }
.likert-opts b { font-size: 1.05rem; }
.likert-opts small { font-size: .68rem; color: var(--muted); line-height: 1.2; }
.likert-opts input:checked + span { background: var(--brand-tint); border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.likert-opts input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (max-width: 36rem) { .likert-opts small { display: none; } }

/* ------------------------------ Cartões e blocos ------------------------------ */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 1.25rem; }
.card > h3:first-child, .card > h2:first-child { margin-bottom: .2rem; }
.card-pad > * + * { margin-top: .85rem; }
.card > * + *:not(.mcard-act) { margin-top: .85rem; }
.card:not(.card-pad):not(.mcard):not(.filters):not(.kpi):not(.perfil) { padding: 1.25rem; }
.empty { text-align: center; padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; gap: .5rem; }
.empty p { color: var(--muted); max-width: 28rem; }
.note { display: flex; gap: .75rem; align-items: flex-start; padding: .8rem 1rem; border-radius: .7rem; background: var(--brand-tint); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); font-size: .92rem; }
.note .i { color: var(--brand); margin-top: .15rem; }
.note-wide { margin-block: .25rem; }
.chip { display: inline-flex; align-items: center; padding: .1rem .55rem; border-radius: 2rem; font-size: .76rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); }
.chip-soft { background: transparent; color: var(--muted); }
.chip-me { background: var(--brand-tint); color: var(--brand); border-color: transparent; }
.chip-new { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.meta { display: flex; flex-wrap: wrap; gap: .35rem .9rem; align-items: center; font-size: .85rem; color: var(--muted); }
.meta > span:not(.chip) { display: inline-flex; align-items: center; gap: .3rem; }
.avatar { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--brand-tint); color: var(--brand); font-weight: 700; font-size: .78rem; flex: none; }

.badge { display: inline-flex; align-items: center; gap: .4rem; padding: .15rem .65rem; border-radius: 2rem; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.badge .dot { width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; }
.st-aberta { background: var(--bad-bg); color: var(--bad); }
.st-analise { background: var(--viol-bg); color: var(--viol); }
.st-andamento { background: var(--warn-bg); color: var(--warn); }
.st-concluida { background: var(--ok-bg); color: var(--ok); }
.us-ativo { background: var(--ok-bg); color: var(--ok); }
.us-suspenso { background: var(--bad-bg); color: var(--bad); }
.us-pendente { background: var(--warn-bg); color: var(--warn); }
.prazo { display: inline-flex; align-items: center; gap: .3rem; font-size: .82rem; font-weight: 600; white-space: nowrap; }
.pz-ok { color: var(--ok); } .pz-warn { color: var(--warn); } .pz-late { color: var(--bad); }
.prazo-line { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem 1rem; }
.rate { display: inline-block; padding: .05rem .5rem; border-radius: 2rem; font-size: .8rem; font-weight: 700; }
.rt-ok { background: var(--ok-bg); color: var(--ok); } .rt-mid { background: var(--warn-bg); color: var(--warn); } .rt-low { background: var(--bad-bg); color: var(--bad); }

/* Cartão de manifestação */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); gap: 1rem; }
.mgrid > .empty { grid-column: 1 / -1; }
.mcard { padding: 1.1rem; display: flex; flex-direction: column; gap: .6rem; }
.mcard-top { display: flex; justify-content: space-between; gap: .6rem; align-items: flex-start; }
.mcard-top h3 { overflow-wrap: anywhere; }
.mcard-desc { color: var(--ink); font-size: .93rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

    const now = Date.now();

    const pick = (a) => a[Math.floor(rnd() * a.length)];

      m.comentarios.forEach((c) => { c.id = seqCom++; });
    });

    const joao = manifs.filter((m) => m.autorId === 1);
    const notificacoes = [];

    return {

/* =========================================================================
   Resolve Aqui - indicadores
   Transformam as manifestações registradas em informação para a gestão e para

(function () {
  'use strict';
  const RA = window.RA;
  const DAY = 864e5;
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  const dias = (a, b) => (new Date(b) - new Date(a)) / DAY;
  RA.dias = dias;
  RA.nomeMes = (i) => MESES[i];

  /* Situação do prazo de resposta (Lei nº 13.460/2017, art. 16) */
  RA.prazo = function (m) {
    const limite = new Date(m.dataCriacao).getTime() + RA.PRAZO_DIAS * DAY;
    if (m.status === 'concluida') {
      const fim = new Date(m.dataConclusao || m.dataCriacao).getTime();
      return { concluida: true, noPrazo: fim <= limite, vencido: false, dias: 0, texto: fim <= limite ? 'Concluída no prazo' : 'Concluída fora do prazo' };
    }
    const resta = Math.ceil((limite - Date.now()) / DAY);
    if (resta < 0) return { concluida: false, vencido: true, dias: -resta, texto: 'Prazo vencido há ' + -resta + (resta === -1 ? ' dia' : ' dias') };
    if (resta === 0) return { concluida: false, vencido: false, dias: 0, texto: 'Vence hoje' };
    return { concluida: false, vencido: false, dias: resta, texto: resta + (resta === 1 ? ' dia restante' : ' dias restantes') };
  };

  const media = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);

  const S = (RA.Stats = {});

  S.apoios = (m) => m.apoiosBase + m.apoios.length;

  S.resumo = function (list) {
    const r = { total: list.length, aberta: 0, analise: 0, andamento: 0, concluida: 0 };
    list.forEach((m) => { r[m.status]++; });
    r.pendentes = r.total - r.concluida;
    r.taxa = r.total ? r.concluida / r.total : 0;
    const concl = list.filter((m) => m.status === 'concluida' && m.dataConclusao);
    const tempos = concl.map((m) => dias(m.dataCriacao, m.dataConclusao));
    r.mediaDias = media(tempos);
    r.foraPrazo = tempos.filter((d) => d > RA.PRAZO_DIAS).length;
    r.atrasadas = list.filter((m) => m.status !== 'concluida' && RA.prazo(m).vencido).length;
    r.apoios = list.reduce((s, m) => s + S.apoios(m), 0);
    return r;
  };

  /* Agrupa e resume por uma chave (categoria, bairro, órgão...) */
  S.agrupar = function (list, chave, rotulo) {
    const mapa = new Map();
    list.forEach((m) => {
      const k = chave(m);
      if (!mapa.has(k)) mapa.set(k, []);
      mapa.get(k).push(m);
    });
    return Array.from(mapa, ([k, itens]) => Object.assign({ chave: k, nome: rotulo ? rotulo(k) : k, itens }, S.resumo(itens)))
      .sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome, 'pt-BR'));
  };

  S.porCategoria = (l) => S.agrupar(l, (m) => m.categoria, (k) => RA.categoria(k).nome);
  S.porBairro = (l) => S.agrupar(l, (m) => m.bairro);
  S.porOrgao = (l) => S.agrupar(l, (m) => m.orgao);
  S.porTipo = (l) => S.agrupar(l, (m) => m.tipo, (k) => RA.TIPOS[k].nome);
  S.porStatus = (l) => Object.keys(RA.STATUS).map((k) => {
    const itens = l.filter((m) => m.status === k);
    return Object.assign({ chave: k, nome: RA.STATUS[k].nome, itens }, S.resumo(itens));
  });

  /* Últimos n meses (recebidas x concluídas) */
  S.porMes = function (list, n) {
    const hoje = new Date();
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
      out.push({ ano: d.getFullYear(), mes: d.getMonth(), recebidas: 0, concluidas: 0, nome: MESES[d.getMonth()] });
    }
    const idx = (iso) => {
      const d = new Date(iso);
      return out.findIndex((x) => x.ano === d.getFullYear() && x.mes === d.getMonth());
    };
    list.forEach((m) => {
      const a = idx(m.dataCriacao);
      if (a >= 0) out[a].recebidas++;
      if (m.status === 'concluida' && m.dataConclusao) {
        const b = idx(m.dataConclusao);
        if (b >= 0) out[b].concluidas++;
      }
    });
    return out;
  };

  /* Pontos recorrentes: mesma categoria no mesmo bairro, ainda sem solução.
     O índice combina quantidade, apoios dos cidadãos e tempo de espera. É um
     subsídio para priorização, não uma decisão automática. */
  S.recorrentes = function (list, minimo) {
    const pend = list.filter((m) => m.status !== 'concluida');
    const grupos = new Map();
    pend.forEach((m) => {
      const k = m.categoria + '|' + m.bairro;
      if (!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(m);
    });
    const out = [];
    grupos.forEach((itens, k) => {
      if (itens.length < (minimo || 2)) return;
      const [categoria, bairro] = k.split('|');
      const espera = itens.map((m) => dias(m.dataCriacao, Date.now()));
      const apoios = itens.reduce((s, m) => s + S.apoios(m), 0);
      const indice = itens.reduce((s, m, i) => s + 1 + S.apoios(m) * 0.25 + Math.min(espera[i], 60) / 30, 0);
      out.push({
        categoria, bairro, qtd: itens.length, apoios, maisAntiga: Math.round(Math.max(...espera)),
        atrasadas: itens.filter((m) => RA.prazo(m).vencido).length, indice: Math.round(indice * 10) / 10,
        orgao: RA.categoria(categoria).orgao, itens,
      });
    });
    return out.sort((a, b) => b.indice - a.indice);
  };

  /* Filtra por período em dias (0 = tudo) */
  S.periodo = (list, nDias) => (nDias ? list.filter((m) => Date.now() - new Date(m.dataCriacao).getTime() <= nDias * DAY) : list);

  /* Variação percentual do volume recebido contra o período anterior de mesma duração */
  S.variacao = function (list, nDias) {
    if (!nDias) return null;
    const agora = Date.now();
    const atual = list.filter((m) => agora - new Date(m.dataCriacao) <= nDias * DAY).length;
    const anterior = list.filter((m) => {
      const d = agora - new Date(m.dataCriacao);
      return d > nDias * DAY && d <= 2 * nDias * DAY;
    }).length;
    if (!anterior) return null;
    return Math.round(((atual - anterior) / anterior) * 100);
  };

  /* Textos de apoio à leitura dos números (gerados a partir dos dados) */
  S.insights = function (list) {
    const r = S.resumo(list);
    const out = [];
    if (!r.total) return out;
    const pct = (x) => Math.round(x * 100) + '%';
    out.push({ tom: r.taxa >= 0.6 ? 'ok' : 'atencao', texto: 'Foram concluídas ' + r.concluida + ' de ' + r.total + ' manifestações (' + pct(r.taxa) + ').' });
    const cats = S.porCategoria(list);
    if (cats[0]) out.push({ tom: 'info', texto: cats[0].nome + ' concentra ' + pct(cats[0].total / r.total) + ' das manifestações. Vale analisar as causas e priorizar ações preventivas.' });
    const bairros = S.porBairro(list);
    if (bairros[0]) out.push({ tom: 'info', texto: bairros[0].nome + ' é o bairro com mais registros (' + bairros[0].total + ').' });
    if (r.atrasadas) out.push({ tom: 'alerta', texto: r.atrasadas + (r.atrasadas === 1 ? ' manifestação pendente passou' : ' manifestações pendentes passaram') + ' do prazo de ' + RA.PRAZO_DIAS + ' dias previsto na Lei nº 13.460/2017.' });
    if (r.mediaDias != null) out.push({ tom: r.mediaDias <= RA.PRAZO_DIAS ? 'ok' : 'alerta', texto: 'O tempo médio de resolução foi de ' + r.mediaDias.toFixed(1).replace('.', ',') + ' dias.' });
    const rec = S.recorrentes(list, 3)[0];
    if (rec) out.push({ tom: 'atencao', texto: 'Há ' + rec.qtd + ' ocorrências pendentes de "' + RA.categoria(rec.categoria).nome + '" em ' + rec.bairro + ', o ponto recorrente de maior prioridade.' });
    return out;
  };

  /* Nome do autor conforme o perfil de quem está vendo (proteção de dados pessoais) */
  RA.nomeAutor = function (m, visao) {
    const u = RA.DB.usuario(m.autorId);
    if (visao === 'gestor') return (u ? u.nome : 'Usuário removido') + (m.anonima ? ' (pediu anonimato)' : '');
    if (m.anonima) return 'Anônimo';
    return RA.nomePublico(u);
  };
  RA.nomePublico = function (u) {
    if (!u) return 'Usuário removido';
    const p = u.nome.split(' ');
    return p.length > 1 ? p[0] + ' ' + p[p.length - 1][0] + '.' : p[0];
  };
})();

  <script>
/* =========================================================================
   Resolve Aqui - camada de dados
   Os dados ficam no localStorage do navegador. Cada função de RA.DB equivale
   a uma operação que, na versão final, viraria uma chamada à API / consulta SQL.
   ========================================================================= */
(function () {
  'use strict';
  const RA = window.RA;
  const KEY = 'resolveaqui.db.v1';
  const SKEY = 'resolveaqui.sessao.v1';
  let db = null;
  const visualizadas = new Set(); // evita contar várias vezes a mesma visualização na sessão

  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
  const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) { /* ignora */ } };
  const agora = () => new Date().toISOString();
  const norm = (s) => String(s || '').trim().toLowerCase();
  const digitos = (s) => String(s || '').replace(/\D/g, '');

  function save() { return lsSet(KEY, JSON.stringify(db)); }

  function load() {
    const raw = lsGet(KEY);
    if (raw) { try { db = JSON.parse(raw); } catch (e) { db = null; } }
    if (!db || db.v !== 1) { db = RA.seed(); save(); }
  }

  function proximo(nome) { return db.seq[nome]++; }
  const clone = (o) => JSON.parse(JSON.stringify(o));

  const DB = (RA.DB = {
    iniciar: load,
    reiniciar() { lsDel(KEY); lsDel(SKEY); visualizadas.clear(); load(); },
    persistiu() { return !!lsGet(KEY); },

    /* ------------------------------ Sessão ------------------------------ */
    usuarioAtual() {
      const id = Number(lsGet(SKEY));
      return id ? db.usuarios.find((u) => u.id === id) || null : null;
    },
    entrar(email, senha) {
      const u = db.usuarios.find((x) => norm(x.email) === norm(email));
      if (!u || u.senha !== senha) return { ok: false, erro: 'E-mail ou senha incorretos.' };
      if (u.status === 'pendente') return { ok: false, pendente: true, userId: u.id, erro: 'Confirme seu e-mail antes de entrar.' };
      if (u.status === 'suspenso') return { ok: false, erro: 'Esta conta está suspensa. Fale com a ouvidoria.' };
      lsSet(SKEY, String(u.id));
      return { ok: true, user: u };
    },
    sair() { lsDel(SKEY); },

    /* ------------------------------ Usuários ------------------------------ */
    usuarios() { return db.usuarios.slice(); },
    usuario(id) { return db.usuarios.find((u) => u.id === Number(id)) || null; },

    registrar(d) {
      if (db.usuarios.some((u) => norm(u.email) === norm(d.email))) return { ok: false, campo: 'email', erro: 'Já existe uma conta com este e-mail.' };
      if (db.usuarios.some((u) => digitos(u.cpf) === digitos(d.cpf))) return { ok: false, campo: 'cpf', erro: 'Já existe uma conta com este CPF.' };
      const codigo = String(Math.floor(100000 + Math.random() * 900000));
      const u = {
        id: proximo('usuario'), nome: d.nome.trim(), email: d.email.trim(), senha: d.senha, cpf: d.cpf, telefone: d.telefone || '',
        bairro: d.bairro, endereco: d.endereco || '', nivel: 'cidadao', status: 'pendente', criadoEm: agora(), codigoConfirmacao: codigo,
      };
      db.usuarios.push(u);
      save();
      return { ok: true, user: u, codigo };
    },
    reenviarCodigo(userId) {
      const u = DB.usuario(userId);
      if (!u) return null;
      u.codigoConfirmacao = String(Math.floor(100000 + Math.random() * 900000));
      save();
      return u.codigoConfirmacao;
    },
    confirmarEmail(userId, codigo) {
      const u = DB.usuario(userId);
      if (!u || u.codigoConfirmacao !== String(codigo).trim()) return { ok: false, erro: 'Código incorreto. Confira o e-mail e tente de novo.' };
      u.status = 'ativo';
      delete u.codigoConfirmacao;
      save();
      lsSet(SKEY, String(u.id));
      DB.notificar([u.id], 'Cadastro confirmado. Bem-vindo ao Resolve Aqui.', null);
      return { ok: true, user: u };
    },
    pedirRecuperacao(email) {
      const u = db.usuarios.find((x) => norm(x.email) === norm(email));
      if (!u) return { ok: true, codigo: null }; // resposta igual para não revelar quais e-mails existem
      const codigo = String(Math.floor(100000 + Math.random() * 900000));
      db.tokens = db.tokens.filter((t) => norm(t.email) !== norm(email));
      db.tokens.push({ email: u.email, codigo, expira: Date.now() + 15 * 60 * 1000 });
      save();
      return { ok: true, codigo };
    },
    redefinirSenha(email, codigo, nova) {
      const t = db.tokens.find((x) => norm(x.email) === norm(email) && x.codigo === String(codigo).trim() && x.expira > Date.now());
      if (!t) return { ok: false, erro: 'Código inválido ou expirado. Peça um novo código.' };
      const u = db.usuarios.find((x) => norm(x.email) === norm(email));
      u.senha = nova;
      if (u.status === 'pendente') u.status = 'ativo';
      db.tokens = db.tokens.filter((x) => x !== t);
      save();
      return { ok: true };
    },
    atualizarUsuario(id, patch) {
      const u = DB.usuario(id);
      if (!u) return { ok: false, erro: 'Usuário não encontrado.' };
      if (patch.email && db.usuarios.some((x) => x.id !== u.id && norm(x.email) === norm(patch.email))) return { ok: false, campo: 'email', erro: 'Este e-mail já está em uso.' };
      if (patch.cpf && db.usuarios.some((x) => x.id !== u.id && digitos(x.cpf) === digitos(patch.cpf))) return { ok: false, campo: 'cpf', erro: 'Este CPF já está em uso.' };
      Object.assign(u, patch);
      save();
      return { ok: true, user: u };
    },
    removerUsuario(id) {
      db.usuarios = db.usuarios.filter((u) => u.id !== Number(id));
      db.notificacoes = db.notificacoes.filter((n) => n.usuarioId !== Number(id));
      save();
    },

    /* ------------------------------ Manifestações ------------------------------ */
    manifestacoes() { return db.manifestacoes.slice(); },
    manifestacao(id) { return db.manifestacoes.find((m) => m.id === Number(id)) || null; },
    porProtocolo(texto) {
      const alvo = String(texto || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!alvo) return null;
      return db.manifestacoes.find((m) => m.protocolo.replace(/[^A-Z0-9]/g, '') === alvo) || null;
    },
    doUsuario(id) { return db.manifestacoes.filter((m) => m.autorId === Number(id)); },

    criarManifestacao(d, user) {
      const cat = RA.categoria(d.categoria);
      const dt = new Date();
      const id = proximo('manifestacao');
      const m = {
        id, protocolo: 'RA-' + dt.getFullYear() + '-' + String(id).padStart(5, '0'),
        tipo: d.tipo, titulo: d.titulo.trim(), descricao: d.descricao.trim(), categoria: d.categoria,
        bairro: d.bairro, endereco: (d.endereco || '').trim(), status: 'aberta', orgao: cat.orgao,
        dataCriacao: dt.toISOString(), dataConclusao: null, autorId: user.id, anonima: !!d.anonima,
        anexos: d.anexos || [], apoiosBase: 0, apoios: [], visualizacoes: 0, comentarios: [],
        historico: [{ data: dt.toISOString(), status: 'aberta', texto: 'Manifestação registrada.' }], resposta: null,
      };
      if (d.coord) m.coord = d.coord;
      db.manifestacoes.push(m);
      if (!save()) {
        db.manifestacoes.pop();
        db.seq.manifestacao--;
        return { ok: false, erro: 'O armazenamento do navegador está cheio. Envie menos anexos ou imagens menores.' };
      }
      return { ok: true, manifestacao: m };
    },
    editarManifestacao(id, patch, user) {
      const m = DB.manifestacao(id);
      if (!m || m.autorId !== user.id) return { ok: false, erro: 'Você só pode editar as suas manifestações.' };
      if (m.status !== 'aberta') return { ok: false, erro: 'Só é possível editar enquanto a manifestação está aberta.' };
      const cat = RA.categoria(patch.categoria || m.categoria);
      Object.assign(m, {
        titulo: patch.titulo.trim(), descricao: patch.descricao.trim(), categoria: cat.id, orgao: cat.orgao,
        bairro: patch.bairro, endereco: (patch.endereco || '').trim(), tipo: patch.tipo || m.tipo, anonima: !!patch.anonima,
      });
      m.historico.push({ data: agora(), status: m.status, texto: 'Manifestação editada pelo autor.' });
      save();
      return { ok: true, manifestacao: m };
    },
    excluirManifestacao(id, user) {
      const m = DB.manifestacao(id);
      if (!m) return { ok: false, erro: 'Manifestação não encontrada.' };
      const gestor = user.nivel === 'gestor';
      if (!gestor && (m.autorId !== user.id || m.status !== 'aberta')) return { ok: false, erro: 'Só é possível excluir manifestações suas que ainda estão abertas.' };
      db.manifestacoes = db.manifestacoes.filter((x) => x.id !== m.id);
      save();
      return { ok: true };
    },
    alternarApoio(id, user) {
      const m = DB.manifestacao(id);
      if (!m) return null;
      const i = m.apoios.indexOf(user.id);
      if (i >= 0) m.apoios.splice(i, 1); else m.apoios.push(user.id);
      save();
      return { apoiou: i < 0, total: m.apoiosBase + m.apoios.length };
    },
    comentar(id, texto, user) {
      const m = DB.manifestacao(id);
      const t = String(texto || '').trim();
      if (!m || !t) return { ok: false, erro: 'Escreva um comentário.' };
      if (t.length > 500) return { ok: false, erro: 'O comentário pode ter no máximo 500 caracteres.' };
      m.comentarios.push({ id: proximo('comentario'), usuarioId: user.id, texto: t, data: agora() });
      save();
      return { ok: true };
    },
    visualizar(id) {
      if (visualizadas.has(id)) return;
      visualizadas.add(id);
      const m = DB.manifestacao(id);
      if (m) { m.visualizacoes++; save(); }
    },
    /* Tratamento pelo gestor: muda status, encaminha ao órgão e registra a resposta oficial */
    tratar(id, { status, orgao, resposta }, gestor) {
      const m = DB.manifestacao(id);
      if (!m) return { ok: false, erro: 'Manifestação não encontrada.' };
      const texto = String(resposta || '').trim();
      if (status === 'concluida' && !texto && !m.resposta) return { ok: false, campo: 'resposta', erro: 'Para concluir, escreva a resposta ao cidadão.' };
      const mudouStatus = status !== m.status;
      const mudouOrgao = orgao && orgao !== m.orgao;
      const novaResposta = texto && (!m.resposta || m.resposta.texto !== texto);
      if (!mudouStatus && !mudouOrgao && !novaResposta) return { ok: false, erro: 'Nenhuma alteração para salvar.' };
      const t = agora();
      if (mudouOrgao) {
        m.orgao = orgao;
        m.historico.push({ data: t, status: m.status, texto: 'Encaminhada para ' + orgao + '.' });
      }
      if (mudouStatus) {
        m.status = status;
        const msgs = { aberta: 'Manifestação reaberta.', analise: 'Em análise pela ouvidoria.', andamento: 'Serviço em andamento em ' + m.orgao + '.', concluida: 'Manifestação concluída.' };
        m.historico.push({ data: t, status, texto: msgs[status] });
        m.dataConclusao = status === 'concluida' ? t : null;
      }
      if (novaResposta) m.resposta = { texto, data: t, autor: gestor.nome, orgao: m.orgao };
      const partes = [];
      if (mudouStatus) partes.push('agora está "' + RA.STATUS[m.status].nome + '"');
      if (mudouOrgao && !mudouStatus) partes.push('foi encaminhada para ' + m.orgao);
      if (novaResposta) partes.push('recebeu uma resposta oficial');
      DB.notificar([m.autorId], 'Sua manifestação "' + m.titulo + '" (' + m.protocolo + ') ' + partes.join(' e ') + '.', m.id);
      save();
      return { ok: true, manifestacao: m };
    },

    /* ------------------------------ Notificações ------------------------------ */
    notificar(userIds, texto, manifestacaoId) {
      userIds.forEach((uid) => {
        if (!DB.usuario(uid)) return;
        db.notificacoes.push({ id: proximo('notificacao'), usuarioId: uid, texto, manifestacaoId: manifestacaoId || null, data: agora(), lida: false });
      });
      save();
    },
    notificacoesDe(userId) { return db.notificacoes.filter((n) => n.usuarioId === Number(userId)).sort((a, b) => new Date(b.data) - new Date(a.data)); },
    marcarLidas(userId) { db.notificacoes.forEach((n) => { if (n.usuarioId === Number(userId)) n.lida = true; }); save(); },

    /* ------------------------------ Avaliações do protótipo ------------------------------ */
    avaliacoes() { return db.avaliacoes.slice(); },
    avaliar(d) { db.avaliacoes.push(Object.assign({ id: proximo('avaliacao'), data: agora() }, clone(d))); return save(); },
  });
})();

/* =========================================================================
   Resolve Aqui - componentes de interface reutilizáveis
   ========================================================================= */
(function () {
  'use strict';
  const RA = window.RA;
  const UI = (RA.UI = {});

  UI.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const esc = UI.esc;
  UI.$ = (sel, root) => (root || document).querySelector(sel);
  UI.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  /* ------------------------------ Ícones (traço, 24x24) ------------------------------ */
  const ICONES = {
    message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',

      if (!tip) { tip = document.getElementById('tooltip'); }
      if (!tip) return;
      tip.textContent = el.getAttribute('data-tip');
      tip.classList.add('on');
      const r = el.getBoundingClientRect();
      const tw = tip.offsetWidth;
      let x = r.left + r.width / 2 - tw / 2;
      x = Math.max(8, Math.min(window.innerWidth - tw - 8, x));
      let y = r.top - tip.offsetHeight - 8;
      if (y < 8) y = r.bottom + 8;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    }
    function esconder() { if (tip) tip.classList.remove('on'); }

    document.addEventListener('focusin', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) mostrar(el); });

  };
  UI.lerImagem = function (file, lado, qualidade) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = reject;
      fr.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const esc2 = Math.min(1, (lado || 900) / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * esc2); c.height = Math.round(img.height * esc2);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', qualidade || 0.72));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  };

  /* Impressão: copia o conteúdo para #print-root e usa o diálogo de impressão do navegador (salvar como PDF) */
  UI.imprimir = function (html) {
    const p = document.getElementById('print-root');
    p.innerHTML = html;
    document.body.classList.add('printing');
    const limpar = () => { document.body.classList.remove('printing'); p.innerHTML = ''; window.removeEventListener('afterprint', limpar); };
    window.addEventListener('afterprint', limpar);
    setTimeout(() => window.print(), 50);
  };

  /* Copiar texto (delegado: qualquer [data-copiar]) */
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copiar]');
    if (!b) return;
    const txt = b.getAttribute('data-copiar');
    const ok = () => UI.toast('Copiado: ' + txt, 'info');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, ok);
    else ok();
  });
})();

  <script>
/* =========================================================================
   Resolve Aqui - blocos compartilhados entre os perfis
   (filtros de lista, cartão de manifestação, janela de detalhes, notificações)
   ========================================================================= */
(function () {
  'use strict';
  const RA = window.RA;
  const UI = RA.UI;
  const esc = UI.esc;
  const icon = UI.icon;

  const sem = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  RA.sem = sem;

  /* Filtra e ordena uma lista de manifestações */
  RA.filtrar = function (list, f) {
    let r = list;
    if (f.q) {
      const q = sem(f.q);
      r = r.filter((m) => sem(m.titulo + ' ' + m.descricao + ' ' + m.protocolo + ' ' + m.endereco + ' ' + m.bairro).includes(q));
    }
    if (f.bairro) r = r.filter((m) => m.bairro === f.bairro);
    if (f.categoria) r = r.filter((m) => m.categoria === f.categoria);
    if (f.status === 'pendente') r = r.filter((m) => m.status !== 'concluida');
    else if (f.status) r = r.filter((m) => m.status === f.status);
    if (f.tipo) r = r.filter((m) => m.tipo === f.tipo);
    if (f.orgao) r = r.filter((m) => m.orgao === f.orgao);
    if (f.atrasadas) r = r.filter((m) => m.status !== 'concluida' && RA.prazo(m).vencido);
    r = r.slice();
    const t = (m) => new Date(m.dataCriacao).getTime();
    if (f.ordem === 'apoios') r.sort((a, b) => RA.Stats.apoios(b) - RA.Stats.apoios(a) || t(b) - t(a));
    else if (f.ordem === 'antigas') r.sort((a, b) => t(a) - t(b));
    else r.sort((a, b) => t(b) - t(a));
    return r;
  };

  /* Cartão usado na lista pública da região */
  RA.cartaoManifestacao = function (m, user) {
    const cat = RA.categoria(m.categoria);
    const apoios = RA.Stats.apoios(m);
    const apoiei = user && m.apoios.indexOf(user.id) >= 0;
    const meu = user && user.id === m.autorId;
    return '<article class="card mcard">' +
      '<div class="mcard-top"><h3>' + esc(m.titulo) + '</h3>' + UI.statusBadge(m.status) + '</div>' +
      '<p class="meta"><span>' + icon('pin', 15) + esc(m.bairro) + '</span><span>' + icon('clock', 15) + UI.data(m.dataCriacao) + '</span><span class="chip">' + esc(cat.nome) + '</span>' +
      (m.tipo !== 'reclamacao' ? '<span class="chip chip-soft">' + esc(RA.TIPOS[m.tipo].nome) + '</span>' : '') + (meu ? '<span class="chip chip-me">Sua manifestação</span>' : '') + '</p>' +
      '<p class="mcard-desc">' + esc(m.descricao) + '</p>' +
      '<div class="mcard-act">' +
      '<button type="button" class="btn btn-primary btn-sm" data-detalhe="' + m.id + '">' + icon('eye', 16) + 'Ver detalhes</button>' +
      '<button type="button" class="btn btn-ghost btn-sm' + (apoiei ? ' is-on' : '') + '" data-apoiar="' + m.id + '" aria-pressed="' + (apoiei ? 'true' : 'false') + '">' + icon('thumb', 16) + (apoiei ? 'Apoiado' : 'Apoiar') + ' (' + apoios + ')</button>' +
      '<span class="mcard-n">' + icon('message', 15) + m.comentarios.length + '</span></div></article>';
  };

  /* Lista de passos do acompanhamento */
  RA.linhaDoTempo = function (m) {
    const itens = m.historico.slice().sort((a, b) => new Date(a.data) - new Date(b.data));
    return '<ol class="timeline">' + itens.map((h, i) => '<li class="tl-' + h.status + (i === itens.length - 1 ? ' is-last' : '') + '"><span class="tl-dot" aria-hidden="true"></span>' +
      '<div><strong>' + esc(h.texto) + '</strong><span class="muted">' + UI.dataHora(h.data) + '</span></div></li>').join('') + '</ol>';
  };

  /* ------------------------------ Janela de detalhes ------------------------------ */
  function corpo(m, ctx) {
    const user = ctx.user;
    const modo = ctx.modo;
    const tipo = RA.TIPOS[m.tipo];
    const cat = RA.categoria(m.categoria);
    const dono = user && user.id === m.autorId;
    const visivel = tipo.publica || dono || modo === 'gestor';
    const autor = RA.nomeAutor(m, modo === 'gestor' ? 'gestor' : 'publica');
    const apoios = RA.Stats.apoios(m);
    const apoiei = user && m.apoios.indexOf(user.id) >= 0;
    const podeApoiar = user && user.nivel === 'cidadao' && !dono && tipo.publica && m.status !== 'concluida';
    const podeComentar = user && user.nivel !== 'vereador' && tipo.publica;

    let h = '<div class="modal-h"><div><div class="title-row"><h2>' + esc(m.titulo) + '</h2>' + UI.statusBadge(m.status) + '</div>' +
      '<p class="meta"><span>' + icon('pin', 15) + esc(m.bairro) + '</span><span>' + icon('clock', 15) + UI.data(m.dataCriacao) + '</span>' +
      '<span class="chip">' + esc(cat.nome) + '</span><span class="chip chip-soft">' + esc(tipo.nome) + '</span></p></div>' +
      '<button type="button" class="icon-btn" data-close aria-label="Fechar">' + icon('x', 20) + '</button></div><div class="modal-b">';

    h += UI.ticket(m);
    h += '<div class="prazo-line">' + UI.prazoBadge(m) + '<span class="muted">Encaminhada para ' + esc(m.orgao) + '</span></div>';

    if (!visivel) {
      h += '<div class="note">' + icon('lock', 18) + '<p>O conteúdo desta ' + esc(tipo.nome.toLowerCase()) + ' é restrito ao autor e à ouvidoria. Aqui aparecem apenas o andamento e a resposta.</p></div>';
    } else {
      h += '<h3>Descrição do problema</h3><p class="pre">' + esc(m.descricao) + '</p>';
      if (m.endereco) h += '<p class="muted">' + icon('pin', 14) + ' ' + esc(m.endereco) + '</p>';
      h += '<p class="muted">Registrada por ' + esc(autor) + '</p>';
      if (m.anexos.length) {
        h += '<h3>' + icon('image', 18) + 'Anexos (' + m.anexos.length + ')</h3><div class="anexos">' + m.anexos.map((a) => a.dataUrl
          ? '<figure class="anexo"><img src="' + a.dataUrl + '" alt="Anexo: ' + esc(a.nome) + '"><figcaption>' + esc(a.nome) + '</figcaption></figure>'
          : '<figure class="anexo anexo-vazio">' + icon('image', 28) + '<figcaption>' + esc(a.nome) + '</figcaption></figure>').join('') + '</div>';
      }
    }

    if (tipo.publica) {
      h += '<div class="stats3"><div class="stat s-blue">' + icon('thumb', 18) + '<span>Apoios</span><strong>' + apoios + '</strong></div>' +
        '<div class="stat s-violet">' + icon('message', 18) + '<span>Comentários</span><strong>' + m.comentarios.length + '</strong></div>' +
        '<div class="stat s-green">' + icon('eye', 18) + '<span>Visualizações</span><strong>' + m.visualizacoes + '</strong></div></div>';
    }

    if (m.resposta) {
      h += '<div class="resposta"><h3>' + icon('shield', 18) + 'Resposta oficial</h3><p class="pre">' + esc(m.resposta.texto) + '</p>' +
        '<p class="muted">' + esc(m.resposta.orgao) + ', ' + UI.dataHora(m.resposta.data) + '</p></div>';
    }

    h += '<h3>Acompanhamento</h3>' + RA.linhaDoTempo(m);

    if (modo === 'gestor') {
      const autorU = RA.DB.usuario(m.autorId);
      h += '<form class="painel-trat" data-form="tratar"><h3>' + icon('edit', 18) + 'Tratamento pela ouvidoria</h3>' +
        (autorU ? '<p class="muted">Autor: ' + esc(autorU.nome) + ', ' + esc(autorU.email) + (autorU.telefone ? ', ' + esc(autorU.telefone) : '') + '</p>' : '') +
        '<div class="grid-2"><div class="field"><label for="tr-status">Situação</label><select id="tr-status" class="input">' +
        Object.keys(RA.STATUS).map((k) => '<option value="' + k + '"' + (k === m.status ? ' selected' : '') + '>' + RA.STATUS[k].nome + '</option>').join('') + '</select></div>' +
        '<div class="field"><label for="tr-orgao">Órgão responsável</label><select id="tr-orgao" class="input">' + UI.opcoes(RA.ORGAOS, m.orgao) + '</select></div></div>' +
        '<div class="field"><label for="tr-resp">Resposta ao cidadão</label><textarea id="tr-resp" class="input" rows="3" maxlength="1000" placeholder="Descreva a providência adotada. O autor será notificado.">' + esc(m.resposta ? m.resposta.texto : '') + '</textarea>' +
        '<p class="hint">Obrigatória para concluir a manifestação.</p></div>' +
        '<button type="submit" class="btn btn-primary">' + icon('check', 16) + 'Salvar tratamento</button></form>';
    }

    if (tipo.publica) {
      h += '<h3>' + icon('message', 18) + 'Comentários (' + m.comentarios.length + ')</h3>';
      if (!m.comentarios.length) h += '<p class="muted">Ainda não há comentários.</p>';
      else {
        h += '<ul class="comentarios">' + m.comentarios.map((c) => {
          const u = RA.DB.usuario(c.usuarioId);
          const nome = RA.nomePublico(u);
          const novo = Date.now() - new Date(c.data).getTime() < 2 * 864e5;
          return '<li>' + UI.avatar(nome) + '<div><p class="c-nome"><strong>' + esc(nome) + '</strong>' + (novo ? '<span class="chip chip-new">Recente</span>' : '') + '<span class="muted">' + UI.dataHora(c.data) + '</span></p><p>' + esc(c.texto) + '</p></div></li>';
        }).join('') + '</ul>';
      }
      if (podeComentar) {
        h += '<form class="field cform" data-form="comentar"><label for="cm-texto">Adicionar seu comentário</label>' +
          '<textarea id="cm-texto" class="input" rows="3" maxlength="500" placeholder="Compartilhe sua opinião ou informações adicionais."></textarea>' +
          '<div class="row-between"><span class="hint" id="cm-cont"></span><button type="submit" class="btn btn-primary btn-sm">' + icon('send', 15) + 'Enviar comentário</button></div></form>';
      } else if (!user) {
        h += '<p class="muted"><a href="#/entrar">Entre na sua conta</a> para comentar e apoiar.</p>';
      }
    }

    h += '</div><div class="modal-f">';
    if (podeApoiar) h += '<button type="button" class="btn btn-primary' + (apoiei ? ' is-on' : '') + '" data-act="apoiar" aria-pressed="' + (apoiei ? 'true' : 'false') + '">' + icon('thumb', 16) + (apoiei ? 'Você apoiou esta manifestação' : 'Apoiar esta manifestação') + '</button>';
    h += '<button type="button" class="btn btn-ghost" data-close>Fechar</button></div>';
    if (podeApoiar) h += '<p class="modal-note">Ao apoiar, você mostra que o problema também afeta você.</p>';
    return h;
  }

  /* modo: 'cidadao' | 'gestor' | 'leitura' (Legislativo). aoMudar: avisa a tela de fundo para atualizar. */
  RA.abrirDetalhe = function (id, opt) {
    opt = opt || {};
    const user = RA.DB.usuarioAtual();
    const m0 = RA.DB.manifestacao(id);
    if (!m0) { UI.toast('Manifestação não encontrada.', 'erro'); return null; }
    const modo = opt.modo || (user && user.nivel === 'gestor' ? 'gestor' : user && user.nivel === 'vereador' ? 'leitura' : 'cidadao');
    RA.DB.visualizar(m0.id);
    const ctx = { user, modo };
    const h = UI.modal(corpo(RA.DB.manifestacao(id), ctx), { size: 'lg', title: m0.titulo, aoFechar: opt.aoMudar });

    function redesenhar(foco) {
      const m = RA.DB.manifestacao(id);
      if (!m) { h.close(); return; }
      const rolagem = h.el.scrollTop;
      h.render(corpo(m, ctx));
      ligarContador();
      h.el.scrollTop = rolagem;
      if (foco) { const el = h.el.querySelector(foco); if (el) el.focus(); }
    }
    function ligarContador() {
      const ta = h.el.querySelector('#cm-texto');
      if (ta) UI.contador(ta, h.el.querySelector('#cm-cont'), 0, 500);
    }
    ligarContador();

    h.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act="apoiar"]');
      if (!b) return;
      const r = RA.DB.alternarApoio(id, user);
      UI.toast(r.apoiou ? 'Apoio registrado.' : 'Apoio removido.', 'ok');
      redesenhar('[data-act="apoiar"]');
    });
    h.el.addEventListener('submit', (e) => {
      const form = e.target.closest('form');
      if (!form) return;
      e.preventDefault();
      if (form.dataset.form === 'comentar') {
        const ta = form.querySelector('textarea');
        UI.limparErros(form);
        const r = RA.DB.comentar(id, ta.value, user);
        if (!r.ok) { UI.erro(ta, r.erro); return; }
        UI.toast('Comentário enviado.', 'ok');
        redesenhar('#cm-texto');
      } else if (form.dataset.form === 'tratar') {
        UI.limparErros(form);
        const r = RA.DB.tratar(id, {
          status: form.querySelector('#tr-status').value,
          orgao: form.querySelector('#tr-orgao').value,
          resposta: form.querySelector('#tr-resp').value,
        }, user);
        if (!r.ok) {
          if (r.campo === 'resposta') UI.erro(form.querySelector('#tr-resp'), r.erro); else UI.toast(r.erro, 'info');
          return;
        }
        UI.toast('Tratamento salvo. O autor foi notificado.', 'ok');
        redesenhar();
        if (RA.atualizarCabecalho) RA.atualizarCabecalho();
      }
    });
    return h;
  };

  /* Delegação global: qualquer [data-detalhe] abre a janela; [data-apoiar] alterna o apoio no cartão */
  RA.ligarCartoes = function (raiz, aoMudar) {
    raiz.addEventListener('click', (e) => {
      const d = e.target.closest('[data-detalhe]');
      if (d) { RA.abrirDetalhe(Number(d.dataset.detalhe), { aoMudar }); return; }
      const a = e.target.closest('[data-apoiar]');
      if (a) {
        const user = RA.DB.usuarioAtual();
        if (!user) { UI.toast('Entre na sua conta para apoiar.', 'info'); location.hash = '#/entrar'; return; }
        if (user.nivel !== 'cidadao') { UI.toast('Apenas cidadãos podem apoiar manifestações.', 'info'); return; }
        const m = RA.DB.manifestacao(Number(a.dataset.apoiar));
        if (m.autorId === user.id) { UI.toast('Você não pode apoiar a sua própria manifestação.', 'info'); return; }
        if (m.status === 'concluida') { UI.toast('Esta manifestação já foi concluída.', 'info'); return; }
        const r = RA.DB.alternarApoio(m.id, user);
        UI.toast(r.apoiou ? 'Apoio registrado.' : 'Apoio removido.', 'ok');
        if (aoMudar) aoMudar();
      }
    });
  };

  /* ------------------------------ Notificações ------------------------------ */
  RA.abrirNotificacoes = function () {
    const user = RA.DB.usuarioAtual();
    if (!user) return;
    const lista = RA.DB.notificacoesDe(user.id);
    const h = UI.modal(UI.cabecalhoModal('Notificações', lista.length ? '' : 'Nada por aqui ainda.') +
      '<div class="modal-b">' + (lista.length ? '<ul class="notifs">' + lista.map((n) => '<li class="' + (n.lida ? '' : 'nova') + '">' +
        '<span class="n-ico">' + icon('bell', 16) + '</span><div><p>' + esc(n.texto) + '</p><span class="muted">' + UI.dataHora(n.data) + '</span></div>' +
        (n.manifestacaoId && RA.DB.manifestacao(n.manifestacaoId) ? '<button type="button" class="btn btn-ghost btn-sm" data-notif="' + n.manifestacaoId + '">Abrir</button>' : '') + '</li>').join('') + '</ul>'
        : UI.vazio('Sem notificações', 'Quando a ouvidoria atualizar uma manifestação sua, o aviso aparece aqui.')) + '</div>', { size: 'md', title: 'Notificações' });
    RA.DB.marcarLidas(user.id);
    if (RA.atualizarCabecalho) RA.atualizarCabecalho();
    h.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-notif]');
      if (b) { h.close(); RA.abrirDetalhe(Number(b.dataset.notif)); }
    });
  };
})();

      '<div class="grid-2 gap-lg"><div class="card"><h3>Assuntos mais registrados</h3>' + UI.barras(cats.map((c) => ({ nome: c.nome, valor: c.total }))) + '</div>' +

        '<li><button type="button" class="feed-btn" data-detalhe="' + m.id + '"><strong>' + esc(m.titulo) + '</strong><span class="muted">' + esc(m.bairro) + ', concluída ' + UI.relativo(m.dataConclusao) + '</span></button></li>').join('') + '</ul>' : UI.vazio('Nada concluído ainda', '')) + '</div></div></section>' +

      '<section class="band"><div class="container sec"><div class="sec-head"><h2>Como funciona</h2></div><ol class="steps">' +
      '<li><span class="step-n">1</span><h3>Registre</h3><p>Descreva o problema, escolha o assunto e o bairro. Pode anexar fotos e, se preferir, pedir anonimato.</p></li>' +
      '<li><span class="step-n">2</span><h3>Triagem</h3><p>A ouvidoria classifica, junta manifestações parecidas e encaminha ao órgão responsável.</p></li>' +
      '<li><span class="step-n">3</span><h3>Tratamento</h3><p>O órgão resolve o problema. Cada mudança entra no histórico e avisa você.</p></li>' +
      '<li><span class="step-n">4</span><h3>Resposta</h3><p>A resposta oficial fica registrada junto ao protocolo, dentro do prazo de ' + RA.PRAZO_DIAS + ' dias.</p></li></ol></div></section>' +

      '<section class="container sec" id="perfis"><div class="sec-head"><h2>Explore o protótipo por perfil</h2><p class="muted">Cada botão entra com uma conta de demonstração. Os dados são fictícios e ficam só neste navegador.</p></div>' +
      '<div class="perfis">' + CONTAS_DEMO.map((c, i) => '<article class="card perfil"><span class="perfil-ico">' + icon(c.icone, 22) + '</span><h3>' + esc(c.nome) + '</h3><p>' + esc(c.texto) + '</p>' +
        '<button type="button" class="btn btn-ghost" data-demo="' + i + '">Entrar como ' + esc(c.quem) + '</button></article>').join('') + '</div></section>';

    $('#f-protocolo', main).addEventListener('submit', (e) => {
      e.preventDefault();
      const v = $('#in-protocolo', main).value.trim();
      location.hash = '#/protocolo' + (v ? '?p=' + encodeURIComponent(v) : '');
    });
    main.addEventListener('click', (e) => {
      const ex = e.target.closest('[data-ex]');
      if (ex) { $('#in-protocolo', main).value = ex.dataset.ex; $('#in-protocolo', main).focus(); return; }
      const d = e.target.closest('[data-demo]');
      if (d) { const c = CONTAS_DEMO[Number(d.dataset.demo)]; entrarComo(c.email, c.senha); }

  /* ------------------------------ Entrar (UC08) ------------------------------ */
  RA.views.entrar = function (main) {
    main.innerHTML = '<div class="container narrow auth"><div class="card card-pad">' +
      '<h1 class="h2">Entrar</h1><p class="muted">Use o e-mail e a senha do seu cadastro.</p>' +
      '<form id="f-login" novalidate><div class="field"><label for="lg-email">E-mail</label><input id="lg-email" class="input" type="email" autocomplete="username" placeholder="voce@exemplo.com" required></div>' +
      '<div class="field"><label for="lg-senha">Senha</label><div class="pw"><input id="lg-senha" class="input" type="password" autocomplete="current-password" required>' +
      '<button type="button" class="pw-btn" data-pw aria-label="Mostrar senha">Mostrar</button></div></div>' +
      '<button class="btn btn-primary btn-block" type="submit">Entrar</button></form>' +
      '<p class="links"><a href="#/recuperar">Esqueci minha senha</a><a href="#/cadastro">Criar conta</a></p>' +
      '<button type="button" class="btn btn-ghost btn-block" disabled title="Integração prevista nos objetivos do projeto. Não está ativa no protótipo.">Entrar com conta gov.br (integração prevista)</button>' +
      '</div>' +
      '<div class="card card-pad demo"><h2 class="h3">Contas de demonstração</h2><ul class="demo-list">' + CONTAS_DEMO.map((c, i) =>
        '<li><div><strong>' + esc(c.nome) + '</strong><span class="muted">' + esc(c.email) + '<br>Senha: ' + esc(c.senha) + '</span></div><button type="button" class="btn btn-ghost btn-sm" data-demo="' + i + '">Usar</button></li>').join('') + '</ul></div></div>';

    const f = $('#f-login', main);
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      UI.limparErros(f);
      const email = $('#lg-email', f); const senha = $('#lg-senha', f);
      if (!UI.emailValido(email.value)) { UI.erro(email, 'Informe um e-mail válido.'); email.focus(); return; }
      if (!senha.value) { UI.erro(senha, 'Informe a senha.'); senha.focus(); return; }

      if (r.ok) { UI.toast('Olá, ' + r.user.nome.split(' ')[0] + '.', 'ok'); location.hash = RA.homeDoNivel(r.user.nivel); return; }

        const p = senha.closest('.field').querySelector('.field-err');

      const pw = e.target.closest('[data-pw]');

  /* ------------------------------ Confirmação de e-mail (UC11) ------------------------------ */
  RA.abrirConfirmacao = function (userId, codigo) {
    const u = RA.DB.usuario(userId);
    if (!u) return;
    const h = UI.modal(UI.cabecalhoModal('Confirme seu e-mail', 'Enviamos um código de 6 dígitos para ' + u.email + '.') +
      '<form class="modal-b" id="f-conf" novalidate><div class="mail-sim"><p class="mail-tag">' + icon('mail', 15) + 'Caixa de entrada simulada</p>' +
      '<p><strong>Assunto:</strong> Seu código de confirmação</p><p>Use o código <strong class="cod" id="cod-sim">' + esc(codigo) + '</strong> para ativar sua conta no Resolve Aqui.</p>' +
      '<p class="muted">No sistema final, este e-mail seria enviado pelo servidor. Aqui ele aparece na tela para a demonstração.</p></div>' +
      '<div class="field"><label for="cf-cod">Código recebido</label><input id="cf-cod" class="input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" autofocus></div>' +
      '<div class="modal-f flush"><button type="button" class="btn btn-ghost" data-novo>Reenviar código</button><button type="submit" class="btn btn-primary">Confirmar cadastro</button></div></form>', { size: 'sm', title: 'Confirmar e-mail' });
    const f = $('#f-conf', h.el);

      if (e.target.closest('[data-novo]')) { $('#cod-sim', f).textContent = RA.DB.reenviarCodigo(userId); UI.toast('Novo código gerado.', 'info'); }

  /* ------------------------------ Cadastro (UC10) ------------------------------ */
  RA.views.cadastro = function (main) {
    main.innerHTML = '<div class="container narrow auth"><div class="card card-pad"><h1 class="h2">Criar conta</h1>' +
      '<p class="muted">Seus dados identificam você perante a ouvidoria. Eles não aparecem para outros cidadãos.</p>' +
      '<form id="f-cad" novalidate><div class="field"><label for="cd-nome">Nome completo</label><input id="cd-nome" class="input" autocomplete="name" required></div>' +
      '<div class="grid-2"><div class="field"><label for="cd-cpf">CPF</label><input id="cd-cpf" class="input" inputmode="numeric" placeholder="000.000.000-00" autocomplete="off" required></div>' +
      '<div class="field"><label for="cd-tel">Telefone (opcional)</label><input id="cd-tel" class="input" inputmode="tel" placeholder="(15) 90000-0000" autocomplete="tel"></div></div>' +
      '<div class="field"><label for="cd-email">E-mail</label><input id="cd-email" class="input" type="email" autocomplete="email" required></div>' +
      '<div class="grid-2"><div class="field"><label for="cd-bairro">Bairro</label><select id="cd-bairro" class="input" required>' + UI.opcoes(RA.BAIRROS, '', 'Selecione') + '</select></div>' +
      '<div class="field"><label for="cd-end">Endereço (opcional)</label><input id="cd-end" class="input" autocomplete="street-address"></div></div>' +
      '<div class="grid-2"><div class="field"><label for="cd-senha">Senha</label><input id="cd-senha" class="input" type="password" autocomplete="new-password" minlength="6" required><p class="hint">Mínimo de 6 caracteres, com letras e números.</p></div>' +
      '<div class="field"><label for="cd-senha2">Repita a senha</label><input id="cd-senha2" class="input" type="password" autocomplete="new-password" required></div></div>' +
      '<label class="check"><input type="checkbox" id="cd-lgpd"><span>Li e concordo que meus dados sejam tratados para o registro e o acompanhamento das minhas manifestações, conforme a Lei Geral de Proteção de Dados (Lei nº 13.709/2018).</span></label>' +
      '<button class="btn btn-primary btn-block" type="submit">Criar conta</button></form>' +
      '<p class="links"><a href="#/entrar">Já tenho conta</a></p></div></div>';
    const f = $('#f-cad', main);
    $('#cd-cpf', f).addEventListener('input', (e) => { e.target.value = UI.mascaraCPF(e.target.value); });
    $('#cd-tel', f).addEventListener('input', (e) => { e.target.value = UI.mascaraTel(e.target.value); });
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      UI.limparErros(f);
      const g = (id) => $('#' + id, f);
      let primeiro = null;
      const falha = (id, msg) => { UI.erro(g(id), msg); if (!primeiro) primeiro = g(id); };
      if (g('cd-nome').value.trim().split(/\s+/).length < 2) falha('cd-nome', 'Informe nome e sobrenome.');
      if (!UI.cpfValido(g('cd-cpf').value)) falha('cd-cpf', 'CPF inválido. Confira os 11 dígitos.');
      if (!UI.emailValido(g('cd-email').value)) falha('cd-email', 'Informe um e-mail válido.');
      if (!g('cd-bairro').value) falha('cd-bairro', 'Escolha o seu bairro.');
      const s = g('cd-senha').value;
      if (s.length < 6 || !/[A-Za-z]/.test(s) || !/\d/.test(s)) falha('cd-senha', 'A senha precisa ter 6 ou mais caracteres, com letras e números.');
      if (g('cd-senha2').value !== s) falha('cd-senha2', 'As senhas não são iguais.');
      if (!g('cd-lgpd').checked) { UI.erro(g('cd-lgpd'), 'É preciso concordar para criar a conta.'); if (!primeiro) primeiro = g('cd-lgpd'); }
      if (primeiro) { primeiro.focus(); return; }
      const r = RA.DB.registrar({
        nome: g('cd-nome').value, cpf: g('cd-cpf').value, telefone: g('cd-tel').value, email: g('cd-email').value,
        bairro: g('cd-bairro').value, endereco: g('cd-end').value, senha: s,
      });
      if (!r.ok) { UI.erro(g(r.campo === 'cpf' ? 'cd-cpf' : 'cd-email'), r.erro); g(r.campo === 'cpf' ? 'cd-cpf' : 'cd-email').focus(); return; }
      RA.abrirConfirmacao(r.user.id, r.codigo);
    });
    $('#cd-nome', main).focus();
  };

  /* ------------------------------ Recuperar acesso (UC09) ------------------------------ */
  RA.views.recuperar = function (main) {
    main.innerHTML = '<div class="container narrow auth"><div class="card card-pad"><h1 class="h2">Recuperar acesso</h1>' +
      '<div id="rec-1"><p class="muted">Informe o e-mail da sua conta. Enviaremos um código para criar uma nova senha.</p>' +
